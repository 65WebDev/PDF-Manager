name: Deploy version feed (Pages)

# Publishes a PUBLIC version-feed.js for the About update check.
# Existing builds already probe:
#   https://65WebDev.github.io/PDF-Manager/version-feed.js
# Private GitHub release assets are not readable from the browser (404),
# so Pages is the public source of truth.

on:
  push:
    branches: [main]
    paths:
      - 'version-feed.js'
      - 'version.json'
      - 'index.html'
      - 'PDF_manager_online.html'
      - '.nojekyll'
      - '.github/workflows/deploy-version-feed-pages.yml'
  workflow_dispatch:
  # Also after HTML releases finish writing the feed.
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-version-feed
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          mkdir -p _site
          # Keep landing page if present.
          if [ -f index.html ]; then cp index.html _site/; fi
          # The landing page's "Open online" button links to this file as a
          # same-site relative path - without it, Pages 404s even though the
          # landing page itself deploys fine.
          if [ -f PDF_manager_online.html ]; then cp PDF_manager_online.html _site/; fi
          if [ -f .nojekyll ]; then cp .nojekyll _site/; else touch _site/.nojekyll; fi
          if [ -f version-feed.js ]; then cp version-feed.js _site/; fi
          if [ -f version.json ]; then cp version.json _site/; fi
          # Tiny JS alias so Content-Type is always script-friendly.
          if [ -f version-feed.js ]; then
            cp version-feed.js _site/version-feed.mjs
          fi
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
