name: Deploy version feed (Pages)

# Publishes a PUBLIC version-feed.js for the About update check.
# Existing builds already probe:
#   https://65WebDev.github.io/PDF-Manager/version-feed.js
# Private GitHub release assets are not readable from the browser (404),
# so Pages is the public source of truth.

on:
  push:
    branches: [main]
    paths:
      - 'version-feed.js'
      - 'version.json'
      - 'index.html'
      - 'PDF_manager_online.html'
      - '.nojekyll'
      - '.github/workflows/deploy-version-feed-pages.yml'
  workflow_dispatch:
  # The Release workflow commits version-feed.js with GITHUB_TOKEN. That
  # commit does not trigger `push` workflows, and creating the GitHub
  # Release with GITHUB_TOKEN does not trigger `release` workflows either —
  # so without this, Pages stays one HTML build behind (About still shows
  # the previous build-* as latest). workflow_run is the documented way to
  # chain off a GITHUB_TOKEN job.
  workflow_run:
    workflows: ['Release']
    types: [completed]
  # Manual / PAT-published build-* releases. Windows/Linux tags are ignored
  # below: the github-pages environment is main-only and those events fail.
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-version-feed
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
      && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'build-'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always take the tip of main. `release` / `workflow_run` otherwise
      # check out the triggering tag or the pre-feed HTML commit, which still
      # has the previous build's version.json.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          mkdir -p _site
          # Keep landing page if present.
          if [ -f index.html ]; then cp index.html _site/; fi
          # The landing page's "Open online" button links to this file as a
          # same-site relative path - without it, Pages 404s even though the
          # landing page itself deploys fine.
          if [ -f PDF_manager_online.html ]; then cp PDF_manager_online.html _site/; fi
          if [ -f .nojekyll ]; then cp .nojekyll _site/; else touch _site/.nojekyll; fi
          if [ -f version-feed.js ]; then cp version-feed.js _site/; fi
          if [ -f version.json ]; then cp version.json _site/; fi
          # Tiny JS alias so Content-Type is always script-friendly.
          if [ -f version-feed.js ]; then
            cp version-feed.js _site/version-feed.mjs
          fi
          echo '--- version.json to deploy ---'
          cat version.json
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
