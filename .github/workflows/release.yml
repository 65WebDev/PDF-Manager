name: Release

on:
  push:
    branches: [main]
    paths:
      - 'PDF_manager_online.html'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Generate version info
        run: |
          BUILD="build-${{ github.run_number }}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DATE_ONLY=$(date -u +%Y-%m-%d)
          DATE_HUMAN=$(date -u +"%Y-%m-%d %H:%M UTC")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "BUILD=${BUILD}" >> "$GITHUB_ENV"
          echo "DATE_ONLY=${DATE_ONLY}" >> "$GITHUB_ENV"
          echo "DATE=${DATE}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          cat > release-notes.md <<EOF
          Автоматическая сборка менеджера PDF.

          - **Сборка:** #${{ github.run_number }}
          - **Коммит:** \`${{ github.sha }}\`
          - **Дата:** ${DATE_HUMAN}

          ### Скачать
          - **Онлайн-версия** (\`PDF_manager_online.html\`) — компактный файл, библиотеки подгружаются из CDN при первом запуске. [Прямая ссылка](https://github.com/${{ github.repository }}/releases/latest/download/PDF_manager_online.html)
          - **Офлайн-версия** (\`PDF_manager_offline.html\`) — все библиотеки встроены в файл, интернет не нужен. [Прямая ссылка](https://github.com/${{ github.repository }}/releases/latest/download/PDF_manager_offline.html)
          EOF

      - name: Write version feed files
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: build-${{ github.run_number }}
          NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest/download/PDF_manager_online.html
          OFFLINE_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest/download/PDF_manager_offline.html
          SKIP_GH: '1'
        run: |
          export DATE="${DATE}"
          export SHORT_COMMIT="${SHORT_SHA}"
          node scripts/publish-version-feed.mjs

      - name: Stamp version into PDF_manager_online.html
        # Runner-local edit only - never committed back to the repo, so the
        # tracked source keeps the placeholders and the "About" modal falls
        # back gracefully to "Версия неизвестна" outside the release pipeline
        # (e.g. the raw file served by GitHub Pages).
        run: |
          sed -i \
            -e "s/__PDF_MANAGER_BUILD__/${BUILD}/g" \
            -e "s/__PDF_MANAGER_DATE__/${DATE_ONLY}/g" \
            PDF_manager_online.html

      - name: Build offline HTML
        # Reads the now-stamped PDF_manager_online.html, so the offline
        # artifact carries the same version/date and also flips the
        # PDF_MANAGER_OFFLINE_BUILD flag used by the "About" modal.
        run: npm run build:offline

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка #${{ github.run_number }}
          body_path: release-notes.md
          make_latest: true
          files: |
            PDF_manager_online.html
            PDF_manager_offline.html
            version.json
            version-feed.js
          generate_release_notes: true

      - name: Publish floating version-feed release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: build-${{ github.run_number }}
          NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest/download/PDF_manager_online.html
          OFFLINE_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest/download/PDF_manager_offline.html
          # version-feed.js / version.json are outside workflow paths: — no loop.
          SKIP_COMMIT: '0'
        run: |
          export DATE="${DATE}"
          export SHORT_COMMIT="${SHORT_SHA}"
          node scripts/publish-version-feed.mjs
