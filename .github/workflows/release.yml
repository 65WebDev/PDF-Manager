name: Release

on:
  push:
    branches: [main]
    paths:
      - 'PDF_manager_online.html'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Build offline HTML
        run: npm run build:offline

      - name: Generate version info
        run: |
          BUILD="build-${{ github.run_number }}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DATE_HUMAN=$(date -u +"%Y-%m-%d %H:%M UTC")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cat > version.json <<EOF
          {
            "build": "${BUILD}",
            "number": ${{ github.run_number }},
            "commit": "${{ github.sha }}",
            "shortCommit": "${SHORT_SHA}",
            "date": "${DATE}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/latest/download/PDF_manager_online.html",
            "offlineDownloadUrl": "https://github.com/${{ github.repository }}/releases/latest/download/PDF_manager_offline.html"
          }
          EOF
          cat > release-notes.md <<EOF
          Автоматическая сборка менеджера PDF.

          - **Сборка:** #${{ github.run_number }}
          - **Коммит:** \`${{ github.sha }}\`
          - **Дата:** ${DATE_HUMAN}

          ### Скачать
          - **Онлайн-версия** (\`PDF_manager_online.html\`) — компактный файл, библиотеки подгружаются из CDN при первом запуске. [Прямая ссылка](https://github.com/${{ github.repository }}/releases/latest/download/PDF_manager_online.html)
          - **Офлайн-версия** (\`PDF_manager_offline.html\`) — все библиотеки встроены в файл, интернет не нужен. [Прямая ссылка](https://github.com/${{ github.repository }}/releases/latest/download/PDF_manager_offline.html)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка #${{ github.run_number }}
          body_path: release-notes.md
          files: |
            PDF_manager_online.html
            PDF_manager_offline.html
            version.json
          generate_release_notes: true
