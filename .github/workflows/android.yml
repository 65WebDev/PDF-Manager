name: Android APK

# Test build of the Android app (APK for ARM phones and tablets), attached to
# the run under "Artifacts". Runs for pull requests that touch the app shell
# (src-tauri/, the Tauri bridge) and on demand (Actions -> Android APK ->
# Run workflow).
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD set,
# the APK is signed with your own key (the same as local builds, it then
# updates an installed release in place). Without them a throwaway key is
# made for the run: the APK installs, but a build signed with your key can
# replace it only after uninstalling it.
# Releases (android-v*) are built and uploaded locally:
#   .\scripts\build-windows-exe.ps1 -AndroidOnly

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'scripts/prepare-tauri-ui.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK and NDKs.
      - name: Android SDK / NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            echo "No NDK on the runner" >&2
            exit 1
          fi
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "NDK: $ndk"

      - name: Rust (Android targets)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: android-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: android-cargo-

      - run: npm ci

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            {
              echo "PM_ANDROID_KEYSTORE=$ks"
              echo "PM_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "PM_ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "PM_ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Signing with the repository key."
          else
            keytool -genkeypair -keystore "$ks" -alias ci -keyalg RSA -keysize 2048 \
              -validity 3650 -storepass android -keypass android \
              -dname "CN=PDF Manager test build"
            {
              echo "PM_ANDROID_KEYSTORE=$ks"
              echo "PM_ANDROID_KEYSTORE_PASSWORD=android"
              echo "PM_ANDROID_KEY_ALIAS=ci"
              echo "PM_ANDROID_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
            echo "No signing secrets - throwaway test key."
          fi

      - name: Build APK
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Collect APK
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          apk=$(ls -t src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n 1)
          mkdir -p dist-android
          cp "$apk" "dist-android/PDF-Manager_${ver}-test.apk"
          ls -l dist-android
          # The build must leave the tracked Android project as it is
          # (what it generates is git-ignored).
          git status --porcelain
          test -z "$(git status --porcelain -- src-tauri/gen/android)"

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-manager-android-apk
          path: dist-android/*.apk
          if-no-files-found: error
