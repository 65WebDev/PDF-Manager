[[permission]]
identifier = "allow-open-pdf-files"
description = "Allows the UI to receive OS file-association paths, read local PDF files into the editor, save straight back to a known local path, check for updates, open https links in the system browser and take the whole screen in reading mode; on Android also to save through the system file picker, share, print and install an update of the app from its releases."
commands.allow = [
  "take_pending_open_files",
  "read_local_file",
  "write_local_file",
  "fetch_url_text",
  "open_external_url",
  "maximize_main_window_cmd",
  "set_main_window_fullscreen",
  "android_stage_chunk",
  "android_pick_save_target",
  "android_pick_folder",
  "android_write_target",
  "android_write_into_folder",
  "android_discard_target",
  "android_share_file",
  "android_print_file",
  "android_install_update",
  "android_update_progress",
  "android_cancel_update"
]
