[[permission]]
identifier = "allow-open-pdf-files"
description = "Allows the UI to receive OS file-association paths, read local PDF files into the editor, save straight back to a known local path, check for updates and open https links in the system browser."
commands.allow = [
  "take_pending_open_files",
  "read_local_file",
  "write_local_file",
  "fetch_url_text",
  "open_external_url",
  "maximize_main_window_cmd"
]
