[package]
name = "pdf-manager"
version = "0.1.8"
description = "Desktop shell for PDF Document Manager (Tauri + offline HTML)"
authors = ["PDF-Manager"]
license = "MIT"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "pdf_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
