<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор схем — P&ID</title>
<style>
  :root{
    --bg:#1a1c1e; --panel:#222528; --panel2:#2a2e32; --line:#36393d;
    --txt:#d7dadd; --txt2:#8b9197; --accent:#e0a44a; --accent-d:#b8842f;
    --red:#e23b3b; --sel:#4a9eff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
  #app{display:flex;height:100vh}

  /* PALETTE */
  #palette{width:200px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
  .pal-section{padding:8px 10px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2);border-top:1px solid var(--line)}
  .pal-section:first-child{border-top:none}
  .pal-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px 8px 8px}
  .pal-item{background:var(--panel2);border:1px solid var(--line);border-radius:5px;
    height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;transition:.12s;gap:2px;user-select:none}
  .pal-item:hover{border-color:var(--accent);background:#30353a}
  .pal-item.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .pal-item svg{pointer-events:none}
  .pal-item span{font-size:9px;color:var(--txt2);text-align:center;line-height:1.1;padding:0 2px}

  /* CANVAS */
  #canvas-wrap{flex:1;position:relative;overflow:hidden;background:#fbfbfa}
  #canvas{position:absolute;top:0;left:0;cursor:default}
  .grid-bg{background-image:
    linear-gradient(#e8e8e6 1px,transparent 1px),
    linear-gradient(90deg,#e8e8e6 1px,transparent 1px);
    background-size:25px 25px}

  /* TOOLBAR */
  #toolbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    display:flex;gap:2px;padding:5px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .tb-btn{background:transparent;border:none;color:var(--txt);width:36px;height:36px;
    border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.1s}
  .tb-btn:hover{background:var(--panel2)}
  .tb-btn.active{background:var(--accent);color:#1a1c1e}
  .tb-sep{width:1px;background:var(--line);margin:4px 3px}

  /* RIGHT INSPECTOR */
  #inspector{width:210px;background:var(--panel);border-left:1px solid var(--line);
    padding:12px;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;gap:14px}
  .insp-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2);margin-bottom:6px}
  .field{margin-bottom:9px}
  .field label{display:block;font-size:11px;color:var(--txt2);margin-bottom:4px}
  .field input[type=text],.field input[type=number],.field select,.field textarea{
    width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:5px;padding:6px 8px;font-size:13px;font-family:inherit}
  .field textarea{resize:vertical;min-height:54px}
  .row{display:flex;gap:6px}
  .row>*{flex:1}
  .swatches{display:flex;gap:5px;flex-wrap:wrap}
  .sw{width:22px;height:22px;border-radius:4px;cursor:pointer;border:2px solid transparent}
  .sw.active{border-color:#fff}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:5px;padding:8px;font-size:12px;cursor:pointer;width:100%;transition:.1s;font-family:inherit}
  .btn:hover{border-color:var(--accent)}
  .btn.danger:hover{border-color:var(--red);color:var(--red)}
  .btn.primary{background:var(--accent);color:#1a1c1e;border-color:var(--accent);font-weight:600}
  .btn.primary:hover{background:var(--accent-d)}
  .toggle-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt)}
  .empty-hint{color:var(--txt2);font-size:12px;line-height:1.5}
  .export-group{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
  .hint{font-size:10px;color:var(--txt2);margin-top:8px;line-height:1.4}
  kbd{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:1px 4px;font-size:10px}

  /* selection handles drawn in SVG */
  .handle{fill:#fff;stroke:var(--sel);stroke-width:1.5;cursor:nwse-resize}
  .rot-handle{fill:var(--sel);stroke:#fff;stroke-width:1.5;cursor:grab}
  textarea.live-edit{position:absolute;z-index:60;border:1px solid var(--sel);
    background:#fff;color:#000;font-family:'Segoe UI',sans-serif;padding:2px 4px;
    outline:none;resize:none;overflow:hidden;line-height:1.2}
  .popmenu{position:fixed;z-index:200;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.45);padding:6px;min-width:170px}
  .popmenu.pm-wide{min-width:220px;padding:10px}
  .pm-item{padding:9px 10px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--txt)}
  .pm-item:hover{background:var(--panel2)}
  .pm-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2);margin-bottom:8px}
  .pm-lab{display:block;font-size:11px;color:var(--txt2);margin:8px 0 4px}
  .pm-inp{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:7px 8px;font-size:13px;font-family:inherit}
  .pm-check{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt);margin-top:9px;cursor:pointer}
  #presetOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:flex;align-items:center;justify-content:center}
  .pe-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;width:660px;max-width:94vw;box-shadow:0 16px 50px rgba(0,0,0,.5)}
  .pe-head{font-size:15px;font-weight:600;color:var(--txt);display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .pe-close{cursor:pointer;color:var(--txt2);font-size:17px;padding:2px 8px;border-radius:5px}
  .pe-close:hover{background:var(--panel2);color:var(--txt)}
  .pe-body{display:flex;gap:14px}
  .pe-side{width:170px;display:flex;flex-direction:column;gap:14px;flex-shrink:0}
  .pe-main{flex:1;min-width:0}
  .pe-grp{display:flex;flex-direction:column;gap:6px}
  .pe-lbl{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em}
  .pe-trow{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .pe-t{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:9px;font-size:15px;cursor:pointer;font-family:inherit;line-height:1}
  .pe-t:hover{border-color:var(--accent)}
  .pe-t.active{background:var(--accent);color:#1a1c1e;border-color:var(--accent)}
  .pe-wide{width:100%;font-size:12px;margin-bottom:5px}
  .pe-sw{display:flex;flex-wrap:wrap;gap:5px}
  .pe-c{width:22px;height:22px;border-radius:5px;cursor:pointer;border:2px solid transparent;display:inline-block}
  .pe-c.on{border-color:#fff}
  .pe-chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt);cursor:pointer}
  #peCanvas{border:1px solid var(--line);border-radius:6px;cursor:crosshair;display:block;width:100%;background:#fff;touch-action:none}
  .pe-foot{display:flex;gap:8px;margin-top:14px;align-items:center}
  .pe-hint{font-size:11px;color:var(--txt2);margin-top:10px;line-height:1.4}
  .pehandle{cursor:pointer}
  #tooltip{position:fixed;z-index:5000;pointer-events:none;background:#2a2e32;color:#e7eaed;
    border:1px solid #43484e;border-radius:7px;padding:6px 10px;font-size:12px;max-width:240px;
    box-shadow:0 6px 20px rgba(0,0,0,.45);opacity:0;transform:translateY(4px);
    transition:opacity .14s ease,transform .14s ease;line-height:1.35}
  #tooltip.show{opacity:1;transform:translateY(0)}
  #tooltip .tt-key{display:inline-block;background:#1a1c1e;border:1px solid #43484e;border-radius:3px;
    padding:0 5px;font-size:10px;margin-left:4px;color:#e0a44a}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);z-index:5000;
    background:#2a2e32;color:#e7eaed;border:1px solid #43484e;border-radius:10px;padding:11px 18px;
    font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.5);opacity:0;transition:opacity .3s,transform .3s;
    display:flex;align-items:center;gap:10px;max-width:80vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast .toast-ico{font-size:16px}
  /* ===== туториал ===== */
  #tourOv{position:fixed;inset:0;z-index:6000;pointer-events:none}
  #tourDim{position:absolute;inset:0;background:rgba(10,12,14,.66);
    -webkit-mask:none;transition:opacity .2s;pointer-events:auto}
  #tourHole{position:absolute;border:2px solid var(--accent);border-radius:10px;
    box-shadow:0 0 0 4000px rgba(10,12,14,.66),0 0 18px rgba(224,164,74,.6);
    transition:all .35s cubic-bezier(.4,0,.2,1);pointer-events:none}
  #tourCard{position:absolute;width:300px;max-width:86vw;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;
    box-shadow:0 16px 50px rgba(0,0,0,.55);pointer-events:auto;transition:all .35s cubic-bezier(.4,0,.2,1)}
  #tourCard .tc-step{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  #tourCard .tc-title{font-size:16px;font-weight:700;color:var(--txt);margin-bottom:7px}
  #tourCard .tc-body{font-size:13px;color:var(--txt2);line-height:1.5;margin-bottom:14px}
  #tourCard .tc-body b{color:var(--txt)}
  #tourCard .tc-foot{display:flex;align-items:center;gap:8px}
  #tourCard .tc-dots{display:flex;gap:5px;flex:1}
  #tourCard .tc-dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
  #tourCard .tc-dot.on{background:var(--accent)}
  #tourCard .tc-skip{background:none;border:none;color:var(--txt2);font-size:12px;cursor:pointer;padding:6px}
  #tourCard .tc-skip:hover{color:var(--txt)}
  #tourCard .tc-next{background:var(--accent);color:#1a1c1e;border:none;border-radius:7px;
    padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  #tourCard .tc-next:hover{background:var(--accent-d)}
  #helpBtn{position:fixed;right:222px;bottom:16px;z-index:55;width:34px;height:34px;border-radius:50%;
    background:var(--panel);border:1px solid var(--line);color:var(--accent);font-size:16px;font-weight:700;
    cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:.12s}
  #helpBtn:hover{border-color:var(--accent);transform:scale(1.08)}
  #splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 40%,#222528,#141618 70%);
    display:flex;align-items:center;justify-content:center;transition:opacity .5s ease;}
  #splash.hide{opacity:0;pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;text-align:center}
  .sp-logo{animation:sppulse 1.6s ease-in-out infinite}
  @keyframes sppulse{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
  .sp-title{margin-top:18px;font-size:25px;font-weight:700;color:var(--txt);letter-spacing:.02em}
  .sp-sub{margin-top:6px;font-size:12px;color:var(--txt2);letter-spacing:.12em;text-transform:uppercase}
  .sp-bar{margin-top:24px;width:220px;height:4px;background:var(--panel2);border-radius:3px;overflow:hidden}
  .sp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-d));border-radius:3px;animation:spload 1.3s ease forwards}
  @keyframes spload{0%{width:0}60%{width:75%}100%{width:100%}}
  .sp-status{margin-top:12px;font-size:11px;color:var(--txt2);font-family:'JetBrains Mono',monospace}
  #areaHint{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:400;
    background:var(--sel);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .pm-areainfo{font-size:11px;color:var(--accent);margin-top:6px}
</style>
</head>
<body>
<div id="splash">
  <div class="sp-inner">
    <svg width="64" height="64" viewBox="0 0 64 64" class="sp-logo">
      <rect x="6" y="6" width="52" height="52" rx="8" fill="none" stroke="#e0a44a" stroke-width="2.5"/>
      <circle cx="22" cy="22" r="6" fill="none" stroke="#d7dadd" stroke-width="2"/>
      <rect x="34" y="34" width="16" height="16" fill="none" stroke="#d7dadd" stroke-width="2"/>
      <line x1="28" y1="22" x2="42" y2="22" stroke="#d7dadd" stroke-width="2"/>
      <line x1="22" y1="28" x2="22" y2="42" stroke="#d7dadd" stroke-width="2"/>
    </svg>
    <div class="sp-title">Редактор схем</div>
    <div class="sp-sub">P&amp;ID · технологические схемы</div>
    <div class="sp-bar"><div class="sp-fill"></div></div>
    <div class="sp-status" id="spStatus">Инициализация…</div>
  </div>
</div>
<div id="app">

  <!-- LEFT PALETTE -->
  <div id="palette"></div>

  <!-- CANVAS -->
  <div id="canvas-wrap">
    <div id="toolbar">
      <button class="tb-btn active" data-tool="select" title="Выбрать / переместить (V)">
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 2l10 5-4 1.5L7 13z" fill="currentColor"/></svg>
      </button>
      <button class="tb-btn" data-tool="line" title="Линия (L)">
        <svg width="18" height="18" viewBox="0 0 18 18"><line x1="3" y1="15" x2="15" y2="3" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="tb-btn" data-tool="polyline" title="Ломаная — клики, двойной клик=конец (P)">
        <svg width="18" height="18" viewBox="0 0 18 18"><polyline points="3,14 7,6 11,11 15,3" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </button>
      <button class="tb-btn" data-tool="arrow" title="Стрелка (A)">
        <svg width="18" height="18" viewBox="0 0 18 18"><line x1="3" y1="15" x2="13" y2="5" stroke="currentColor" stroke-width="2"/><path d="M13 5l-1 5 5-1z" fill="currentColor"/></svg>
      </button>
      <div class="tb-sep"></div>
      <button class="tb-btn" data-tool="rect" title="Прямоугольник (R)">
        <svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="5" width="12" height="8" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </button>
      <button class="tb-btn" data-tool="circle" title="Круг (C)">
        <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </button>
      <button class="tb-btn" data-tool="dashcircle" title="Красный пунктирный круг (D)">
        <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6" stroke="#e23b3b" stroke-width="2" fill="none" stroke-dasharray="3 2"/></svg>
      </button>
      <button class="tb-btn" data-tool="text" title="Текст (T)">
        <svg width="18" height="18" viewBox="0 0 18 18"><text x="3" y="14" font-size="15" font-weight="bold" fill="currentColor">T</text></svg>
      </button>
      <div class="tb-sep"></div>
      <button class="tb-btn" data-act="undo" title="Отменить (Ctrl+Z)">
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M6 4L2 8l4 4M2 8h9a4 4 0 010 8" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
      <button class="tb-btn" data-act="redo" title="Повторить (Ctrl+Y)">
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M12 4l4 4-4 4M16 8H7a4 4 0 000 8" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
      <button class="tb-btn" data-act="duplicate" title="Дублировать (Ctrl+D)">
        <svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="3" width="9" height="9" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="6" y="6" width="9" height="9" stroke="currentColor" stroke-width="1.5" fill="var(--panel)"/></svg>
      </button>
      <div class="tb-sep"></div>
      <button class="tb-btn" data-act="clear" title="Очистить полотно">
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M5 6h8l-1 9H6zM3 4h12M7 4V2.5h4V4" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
      </button>
    </div>
    <svg id="canvas"></svg>
  </div>

  <!-- RIGHT INSPECTOR -->
  <div id="inspector"></div>
</div>
<button id="helpBtn" title="Краткий тур по редактору (?)">?</button>

<script>
/* =========================================================================
   STATE
   ========================================================================= */
const NS='http://www.w3.org/2000/svg';
const canvas=document.getElementById('canvas');
const palette=document.getElementById('palette');
const inspector=document.getElementById('inspector');
const wrap=document.getElementById('canvas-wrap');

let W=4000,H=3000;            // logical canvas size (large workspace)
let view={x:0,y:0,scale:1};   // pan/zoom
let objects=[];               // all drawing objects
let selected=null;            // одиночное выделение (для инспектора)
let selSet=new Set();         // множественное выделение (id объектов)
let tool='select';
let idCounter=1;
let curStroke='#000000', curFill='none', curWidth=2;
const undoStack=[], redoStack=[];

/* layer groups */
const gWorld=mk('g'); canvas.appendChild(gWorld);
const gObjects=mk('g'); gWorld.appendChild(gObjects);
const gOverlay=mk('g'); gWorld.appendChild(gOverlay); // selection handles

function mk(t){return document.createElementNS(NS,t)}
function uid(){return 'o'+(idCounter++)}
// --- выделение: selSet источник истины, selected = единственный выбранный ---
function selSyncSingle(){ selected = (selSet.size===1)?[...selSet][0]:null; }
function setSelOne(id){ selSet=new Set(id?[id]:[]); selSyncSingle(); }
function clearSel(){ selSet.clear(); selected=null; }
function toggleSel(id){ if(selSet.has(id))selSet.delete(id); else selSet.add(id); selSyncSingle(); }
function isSel(id){ return selSet.has(id); }

/* =========================================================================
   SYMBOL LIBRARY  — each returns an SVG group string drawn at local 0,0
   bbox roughly within given w/h. Symbols are vector, scalable.
   ========================================================================= */
const SYMBOLS={
  /* --- valves / fittings --- */
  valve:{w:60,h:34,label:'Задвижка',cat:'Арматура',
    draw:(c)=>`<path d="M2 2 L30 17 L2 32 Z M58 2 L30 17 L58 32 Z" fill="none" stroke="${c}" stroke-width="2"/>`},
  valve_filled:{w:60,h:34,label:'Задвижка закр.',cat:'Арматура',
    draw:(c,f)=>`<path d="M2 2 L30 17 L2 32 Z M58 2 L30 17 L58 32 Z" fill="${f==='none'?c:f}" stroke="${c}" stroke-width="2"/>`},
  valve_circle:{w:60,h:34,label:'Кран',cat:'Арматура',
    draw:(c,f)=>`<path d="M2 2 L30 17 L2 32 Z M58 2 L30 17 L58 32 Z" fill="${f==='none'?'#fff':f}" stroke="${c}" stroke-width="2"/><circle cx="30" cy="17" r="6.5" fill="${c}"/>`},
  gate_top:{w:30,h:40,label:'Клапан (бабочка)',cat:'Арматура',
    draw:(c)=>`<path d="M4 28 L26 12 M4 12 L26 28" stroke="${c}" stroke-width="2"/><circle cx="15" cy="20" r="11" fill="none" stroke="${c}" stroke-width="2"/><line x1="15" y1="9" x2="15" y2="2" stroke="${c}" stroke-width="2"/><line x1="9" y1="2" x2="21" y2="2" stroke="${c}" stroke-width="2"/>`},
  flange:{w:24,h:44,label:'Фланец',cat:'Арматура',
    draw:(c)=>`<line x1="6" y1="2" x2="6" y2="42" stroke="${c}" stroke-width="2.5"/><line x1="16" y1="2" x2="16" y2="42" stroke="${c}" stroke-width="2.5"/>`},
  blind:{w:30,h:50,label:'Поворотн. заглушка',cat:'Арматура',
    draw:(c)=>`<line x1="8" y1="4" x2="8" y2="46" stroke="${c}" stroke-width="2.5"/><line x1="20" y1="4" x2="20" y2="46" stroke="${c}" stroke-width="2.5"/><circle cx="8" cy="25" r="4" fill="${c}"/><line x1="8" y1="25" x2="26" y2="14" stroke="${c}" stroke-width="2"/>`},

  /* --- equipment --- */
  tank:{w:200,h:180,label:'Резервуар Р-21',cat:'Оборудование',
    draw:(c)=>`
      <!-- корпус: вертикальные стенки + покатая крыша домиком -->
      <path d="M10 56 L10 172 L190 172 L190 56 L100 20 Z" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- центральный дыхательный клапан-гусёк -->
      <path d="M100 20 L100 8" stroke="${c}" stroke-width="2"/>
      <path d="M92 8 q8 -9 16 0" fill="none" stroke="${c}" stroke-width="2"/>
      <!-- левый малый штуцер -->

/* =========================================================================
   PALETTE BUILD
   ========================================================================= */
let userPresets={}; // ключ -> {label, w, h, svg}
function rebuildPresetsPalette(){
  for(const k in SYMBOLS){if(SYMBOLS[k].cat==='Мои фигуры'||SYMBOLS[k].cat==='Импорт')delete SYMBOLS[k];}
  for(const k in userPresets){
    const p=userPresets[k];
    const tpl=p.svgTemplate||p.svg||'';
    SYMBOLS[k]={w:p.w,h:p.h,label:p.label,cat:p._imported?'Импорт':'Мои фигуры',
      draw:(c)=>tpl.split('${c}').join(c||'#000'),_preset:true,_imported:p._imported};
  }
  buildPalette();
}

function buildPalette(){
  const cats={};
  for(const k in SYMBOLS){const s=SYMBOLS[k];(cats[s.cat]=cats[s.cat]||[]).push(k);}
  let html='';
  for(const cat in cats){
    html+=`<div class="pal-section">${cat}</div><div class="pal-grid">`;
    cats[cat].forEach(k=>{
      const s=SYMBOLS[k];
      const sc=Math.min(36/s.w,30/s.h);
      html+=`<div class="pal-item" data-sym="${k}" title="${s.label}">
        <svg width="${s.w*sc}" height="${s.h*sc}" viewBox="0 0 ${s.w} ${s.h}">${s.draw('#cfd2d6','none')}</svg>
        <span>${s.label}</span></div>`;
    });
    html+='</div>';
  }
  // секция создания своей фигуры
  html+=`<div class="pal-section">Мои фигуры</div>
    <div style="padding:6px 8px"><button class="btn" id="newPresetBtn" style="font-size:11px;padding:7px">+ Создать фигуру</button></div>`;
  palette.innerHTML=html;
  palette.querySelectorAll('.pal-item').forEach(el=>{
    el.onclick=()=>{
      palette.querySelectorAll('.pal-item').forEach(p=>p.classList.remove('active'));
      el.classList.add('active');
      pendingSymbol=el.dataset.sym;
      setTool('place');
    };
    // ПКМ по пресету — удалить
    el.oncontextmenu=(e)=>{
      const sym=el.dataset.sym;
      if(SYMBOLS[sym]&&SYMBOLS[sym]._preset){
        e.preventDefault();
        if(confirm('Удалить фигуру «'+SYMBOLS[sym].label+'» из палитры?')){
          delete userPresets[sym];rebuildPresetsPalette();
        }
      }
    };
  });
  const np=palette.querySelector('#newPresetBtn');
  if(np)np.onclick=openPresetEditor;
}
let pendingSymbol=null;

/* =========================================================================
   COORD TRANSFORM
   ========================================================================= */
function applyView(){gWorld.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.scale})`)}
function toWorld(e){
  const r=canvas.getBoundingClientRect();
  return{x:(e.clientX-r.left-view.x)/view.scale, y:(e.clientY-r.top-view.y)/view.scale};
}
function resize(){canvas.setAttribute('width',wrap.clientWidth);canvas.setAttribute('height',wrap.clientHeight);}
window.addEventListener('resize',resize);

/* grid background as a pattern rect in world */
const bgRect=mk('rect');
bgRect.setAttribute('x',-2000);bgRect.setAttribute('y',-2000);
bgRect.setAttribute('width',W+4000);bgRect.setAttribute('height',H+4000);
bgRect.setAttribute('fill','url(#grid)');
const defs=mk('defs');
defs.innerHTML=`<pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
  <path d="M5 0 V25 M10 0 V25 M15 0 V25 M20 0 V25 M0 5 H25 M0 10 H25 M0 15 H25 M0 20 H25" fill="none" stroke="#eeeeec" stroke-width="0.6"/>
  <path d="M25 0 L0 0 0 25" fill="none" stroke="#dcdcd8" stroke-width="1"/></pattern>`;
canvas.appendChild(defs);
gWorld.insertBefore(bgRect,gObjects);

/* =========================================================================
   OBJECT MODEL & RENDER
   each object: {id,type,...props, x,y,rot,scale}
   ========================================================================= */
function render(){
  gObjects.innerHTML='';
  objects.forEach(o=>{
    const el=mk('g');
    el.setAttribute('data-id',o.id);
    el.style.cursor=tool==='select'?'move':'default';
    let inner='';
    if(o.type==='image'){
      if(o._hide){gObjects.appendChild(el);return;}
      const op=o.opacity??1;
      inner=`<image href="${o.href}" x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" opacity="${op}" preserveAspectRatio="none" transform="rotate(${o.rot||0},${o.x+o.w/2},${o.y+o.h/2})"/>`;
      el.innerHTML=inner;
      gObjects.appendChild(el);
      return;
    }
    if(o.type==='symbol'){
      const s=SYMBOLS[o.sym];
      if(o.scale!==undefined){o.sx=o.sy=o.scale;delete o.scale;} // миграция старого формата
      const sx=o.sx??1, sy=o.sy??1;
      const cx=s.w*sx/2, cy=s.h*sy/2;
      const hit=`<rect x="${o.x}" y="${o.y}" width="${s.w*sx}" height="${s.h*sy}" fill="transparent" transform="rotate(${o.rot},${o.x+cx},${o.y+cy})"/>`;
      inner=hit+`<g transform="translate(${o.x},${o.y}) rotate(${o.rot},${cx},${cy}) scale(${sx},${sy})">${s.draw(o.stroke,o.fill)}</g>`;
    }else if(o.type==='line'||o.type==='arrow'){
      const mid=o.type==='arrow'?`marker-end="url(#${arrowMarker(o.stroke)})"`:'';
      inner=`<line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke="${o.stroke}" stroke-width="${o.width}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} ${mid}/>`;
    }else if(o.type==='polyline'){
      const pts=o.points.map(p=>p.join(',')).join(' ');
      inner=`<polyline points="${pts}" fill="none" stroke="${o.stroke}" stroke-width="${o.width}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} ${o.arrow?`marker-end="url(#${arrowMarker(o.stroke)})"`:''}/>`;
    }else if(o.type==='rect'){
      const hit=o.fill==='none'?`<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" fill="transparent" transform="rotate(${o.rot},${o.x+o.w/2},${o.y+o.h/2})"/>`:'';
      inner=hit+`<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" fill="${o.fill}" stroke="${o.stroke}" stroke-width="${o.width}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} transform="rotate(${o.rot},${o.x+o.w/2},${o.y+o.h/2})"/>`;
    }else if(o.type==='circle'){
      const hit=o.fill==='none'?`<ellipse cx="${o.x}" cy="${o.y}" rx="${o.rx}" ry="${o.ry}" fill="transparent"/>`:'';
      inner=hit+`<ellipse cx="${o.x}" cy="${o.y}" rx="${o.rx}" ry="${o.ry}" fill="${o.fill}" stroke="${o.stroke}" stroke-width="${o.width}" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;
    }else if(o.type==='text'){
      if(o._editing){gObjects.appendChild(el);return;}
      const lines=o.text.split('\n');
      const ts=lines.map((l,i)=>`<tspan x="${o.x}" dy="${i===0?0:o.size*1.2}">${escapeXml(l)||' '}</tspan>`).join('');
      const bb=bbox(o);
      const hit=`<rect x="${bb.x}" y="${bb.y}" width="${bb.w}" height="${bb.h}" fill="transparent" transform="rotate(${o.rot},${o.x},${o.y})"/>`;
      inner=hit+`<text x="${o.x}" y="${o.y}" font-size="${o.size}" font-family="${o.font}" font-weight="${o.bold?'bold':'normal'}" font-style="${o.italic?'italic':'normal'}" fill="${o.stroke}" transform="rotate(${o.rot},${o.x},${o.y})">${ts}</text>`;
    }
    el.innerHTML=inner;
    gObjects.appendChild(el);
  });
  drawSelection();
}
function escapeXml(s){return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}

/* arrowhead markers — one per color, created on demand so the head matches the line */
const _arrowColors=new Set();
function arrowMarker(color){
  const id='ah_'+color.replace(/[^a-z0-9]/gi,'');
  if(!_arrowColors.has(id)){
    _arrowColors.add(id);
    const m=mk('marker');
    m.setAttribute('id',id);m.setAttribute('markerWidth','6');m.setAttribute('markerHeight','6');
    m.setAttribute('refX','5');m.setAttribute('refY','3');m.setAttribute('orient','auto');
    m.setAttribute('markerUnits','strokeWidth');
    m.innerHTML=`<path d="M0 0 L6 3 L0 6 L1.5 3 Z" fill="${color}"/>`;
    defs.appendChild(m);
  }
  return id;
}

/* =========================================================================
   BOUNDING BOX (for selection / handles)
   ========================================================================= */
function bbox(o){
  if(o.type==='image'){return{x:o.x,y:o.y,w:o.w,h:o.h};}
  if(o.type==='symbol'){const s=SYMBOLS[o.sym];const sx=o.sx??o.scale??1,sy=o.sy??o.scale??1;return{x:o.x,y:o.y,w:s.w*sx,h:s.h*sy};}
  if(o.type==='line'||o.type==='arrow'){return{x:Math.min(o.x1,o.x2),y:Math.min(o.y1,o.y2),w:Math.abs(o.x2-o.x1),h:Math.abs(o.y2-o.y1)};}
  if(o.type==='polyline'){const xs=o.points.map(p=>p[0]),ys=o.points.map(p=>p[1]);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};}
  if(o.type==='rect'){return{x:o.x,y:o.y,w:o.w,h:o.h};}
  if(o.type==='circle'){return{x:o.x-o.rx,y:o.y-o.ry,w:o.rx*2,h:o.ry*2};}
  if(o.type==='text'){const lines=o.text.split('\n');const w=Math.max(...lines.map(l=>l.length))*o.size*0.55;return{x:o.x,y:o.y-o.size,w:w||20,h:lines.length*o.size*1.2};}
  return{x:0,y:0,w:0,h:0};
}
function drawSelection(){
  gOverlay.innerHTML='';
  // множественное выделение: рамки вокруг каждого, без маркеров
  if(selSet.size>1){
    selSet.forEach(sid=>{
      const o=objects.find(x=>x.id===sid);if(!o)return;
      const b=bbox(o);const pad=3/view.scale;
      const r=mk('rect');
      r.setAttribute('x',b.x-pad);r.setAttribute('y',b.y-pad);
      r.setAttribute('width',b.w+pad*2);r.setAttribute('height',b.h+pad*2);
      r.setAttribute('fill','none');r.setAttribute('stroke','#4a9eff');
      r.style.pointerEvents='none';
      r.setAttribute('stroke-width',1.2/view.scale);r.setAttribute('stroke-dasharray',`${3/view.scale} ${2/view.scale}`);
      gOverlay.appendChild(r);
    });
    return;
  }
  if(!selected)return;
  const o=objects.find(x=>x.id===selected); if(!o)return;
  const b=bbox(o);
  const pad=4/view.scale;
  const r=mk('rect');
  r.setAttribute('x',b.x-pad);r.setAttribute('y',b.y-pad);
  r.setAttribute('width',b.w+pad*2);r.setAttribute('height',b.h+pad*2);
  r.setAttribute('fill','none');r.setAttribute('stroke',o.locked?'#8b9197':'#4a9eff');
  r.setAttribute('stroke-width',1.2/view.scale);r.setAttribute('stroke-dasharray',`${4/view.scale} ${3/view.scale}`);
  gOverlay.appendChild(r);
  if(o.locked){
    // значок замка вместо маркеров
    const s=12/view.scale, lx=b.x+b.w-s, ly=b.y-s*1.6;
    const g=mk('g');g.setAttribute('transform',`translate(${lx},${ly}) scale(${1/view.scale})`);
    g.innerHTML=`<rect x="0" y="5" width="12" height="9" rx="1.5" fill="#8b9197"/><path d="M2.5 5 V3.5 a3.5 3.5 0 0 1 7 0 V5" fill="none" stroke="#8b9197" stroke-width="1.6"/>`;
    gOverlay.appendChild(g);
    return; // никаких маркеров
  }
  // 8 resize handles + rotate handle for scalable types
  if(['symbol','rect','circle','text','image'].includes(o.type)){
    const hs=8/view.scale;
    const pts=[
      ['nw',b.x,b.y,'nwse-resize'],['n',b.x+b.w/2,b.y,'ns-resize'],['ne',b.x+b.w,b.y,'nesw-resize'],
      ['e',b.x+b.w,b.y+b.h/2,'ew-resize'],['se',b.x+b.w,b.y+b.h,'nwse-resize'],['s',b.x+b.w/2,b.y+b.h,'ns-resize'],
      ['sw',b.x,b.y+b.h,'nesw-resize'],['w',b.x,b.y+b.h/2,'ew-resize']
    ];
    // text scales uniformly from corner
    const allow = o.type==='text' ? ['nw','ne','se','sw'] : ['nw','n','ne','e','se','s','sw','w'];
    pts.forEach(([role,hx,hy,cur])=>{
      if(!allow.includes(role))return;
      const h=mk('rect');h.setAttribute('class','handle');
      h.setAttribute('x',hx-hs/2);h.setAttribute('y',hy-hs/2);
      h.setAttribute('width',hs);h.setAttribute('height',hs);
      h.style.strokeWidth=1.5/view.scale;h.style.cursor=cur;
      h.dataset.role='rz-'+role;gOverlay.appendChild(h);
    });
    // rotate handle above top-center
    const rx=b.x+b.w/2, ry=b.y-26/view.scale;
    const stem=mk('line');stem.setAttribute('x1',b.x+b.w/2);stem.setAttribute('y1',b.y);
    stem.setAttribute('x2',rx);stem.setAttribute('y2',ry);
    stem.setAttribute('stroke','#4a9eff');stem.setAttribute('stroke-width',1.2/view.scale);gOverlay.appendChild(stem);
    const rh=mk('circle');rh.setAttribute('cx',rx);rh.setAttribute('cy',ry);rh.setAttribute('r',6/view.scale);
    rh.setAttribute('class','rot-handle');rh.style.strokeWidth=1.5/view.scale;rh.dataset.role='rotate';gOverlay.appendChild(rh);
  }
  // endpoint handles for lines
  if(o.type==='line'||o.type==='arrow'){
    [[o.x1,o.y1,'p1'],[o.x2,o.y2,'p2']].forEach(([x,y,role])=>{
      const c=mk('circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',6/view.scale);
      c.setAttribute('class','handle');c.style.strokeWidth=1.5/view.scale;c.dataset.role=role;gOverlay.appendChild(c);
    });
  }
  if(o.type==='polyline'){
    o.points.forEach((p,i)=>{const c=mk('circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',5/view.scale);c.setAttribute('class','handle');c.style.strokeWidth=1.5/view.scale;c.dataset.role='pt'+i;gOverlay.appendChild(c);});
  }
}

/* =========================================================================
   TOOL HANDLING
   ========================================================================= */
function setTool(t){
  tool=t;
  document.querySelectorAll('.tb-btn[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
  if(t!=='place'){palette.querySelectorAll('.pal-item').forEach(p=>p.classList.remove('active'));pendingSymbol=null;}
  canvas.style.cursor = (t==='select')?'grab':'crosshair';
  render();
}
document.querySelectorAll('.tb-btn[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
document.querySelectorAll('.tb-btn[data-act]').forEach(b=>b.onclick=()=>doAct(b.dataset.act));

function doAct(a){
  if(a==='undo')undo();
  else if(a==='redo')redo();
  else if(a==='duplicate')duplicateSel();
  else if(a==='clear')clearCanvas();
}
function clearCanvas(){
  if(!objects.length)return;
  if(confirm('Очистить полотно? Все элементы будут удалены (можно отменить через Ctrl+Z).')){
    pushUndo();objects=[];clearSel();render();buildInspector();toast('Полотно очищено · Ctrl+Z вернёт',2600,'🧹');
  }
}

/* =========================================================================
   POINTER INTERACTIONS
   ========================================================================= */
let drag=null, polyDraft=null, spaceDown=false;
let lastClick={id:null,t:0};

canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  if(e.button===2){ // правый клик — выделить объект под курсором (даже закреплённый)
    const id=pickObject(e.target);
    if(id){setSelOne(id);buildInspector();render();}
    return;
  }
  if(e.button===1||spaceDown){ // pan
    drag={mode:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};
    canvas.setPointerCapture(e.pointerId);return;
  }
  const w=toWorld(e);

  // clicking selection handle?
  const handleEl=e.target.closest('.handle, .rot-handle');
  if(handleEl&&selected){
    const o=objects.find(x=>x.id===selected);
    if(o&&o.locked){return;} // закреплён — маркеры не работают
    pushUndo();
    drag={mode:'handle',role:handleEl.dataset.role,o,start:w,orig:JSON.parse(JSON.stringify(o))};
    canvas.setPointerCapture(e.pointerId);return;
  }

  if(tool==='select'){
    const id=pickObject(e.target);
    const oHit=id?objects.find(x=>x.id===id):null;

    // Shift+клик по объекту — добавить/убрать из выделения
    if(id && oHit && !oHit.locked && e.shiftKey){
      toggleSel(id);buildInspector();render();return;
    }

    if(id && oHit && !oHit.locked){
      // двойной клик по тексту -> правка
      const now=Date.now();
      if(oHit.type==='text'&&lastClick.id===id&&now-lastClick.t<350&&selSet.size<=1){
        lastClick={id:null,t:0};setSelOne(id);render();startTextEdit(oHit,false);return;
      }
      lastClick={id,t:now};
      // если кликнули по уже выделенному (в группе) — двигаем всю группу; иначе выбираем только его
      if(!selSet.has(id)) setSelOne(id);
      buildInspector();
      pushUndo();
      // готовим групповое перемещение: запоминаем оригиналы всех выбранных
      const movers=[...selSet].map(sid=>{const oo=objects.find(x=>x.id===sid);return oo?{o:oo,orig:JSON.parse(JSON.stringify(oo))}:null;}).filter(Boolean);
      drag={mode:'move',movers,start:w};
      render();
      canvas.setPointerCapture(e.pointerId);
    }else{
      // пустое место (или закреплённый): рамка выделения, если потянули; одиночный клик — снять выделение
      lastClick={id:null,t:0};
      drag={mode:'marquee',sx:e.clientX,sy:e.clientY,start:w,box:null,moved:false,
            wasLockedHit:!!(oHit&&oHit.locked)};
      canvas.setPointerCapture(e.pointerId);
    }
    return;
  }

  if(tool==='place'&&pendingSymbol){
    pushUndo();
    const s=SYMBOLS[pendingSymbol];
    const o={id:uid(),type:'symbol',sym:pendingSymbol,x:snap(w.x)-s.w/2,y:snap(w.y)-s.h/2,rot:0,sx:1,sy:1,stroke:curStroke==='#000000'?'#000':curStroke,fill:curFill};
    objects.push(o);setSelOne(o.id);setTool('select');buildInspector();render();
    return;
  }

  if(tool==='line'||tool==='arrow'){
    pushUndo();
    const o={id:uid(),type:tool,x1:snap(w.x),y1:snap(w.y),x2:snap(w.x),y2:snap(w.y),stroke:curStroke,width:curWidth,dash:''};
    objects.push(o);setSelOne(o.id);
    drag={mode:'draw-line',o};canvas.setPointerCapture(e.pointerId);return;
  }
  if(tool==='rect'){
    pushUndo();
    const o={id:uid(),type:'rect',x:snap(w.x),y:snap(w.y),w:0,h:0,rot:0,stroke:curStroke,fill:curFill,width:curWidth,dash:''};
    objects.push(o);setSelOne(o.id);drag={mode:'draw-rect',o,ox:o.x,oy:o.y};canvas.setPointerCapture(e.pointerId);return;
  }
  if(tool==='circle'||tool==='dashcircle'){
    pushUndo();
    const isDash=tool==='dashcircle';
    const o={id:uid(),type:'circle',x:snap(w.x),y:snap(w.y),rx:0,ry:0,stroke:isDash?'#e23b3b':curStroke,fill:isDash?'none':curFill,width:curWidth,dash:isDash?'8 5':''};
    objects.push(o);setSelOne(o.id);drag={mode:'draw-circle',o,cx:o.x,cy:o.y};canvas.setPointerCapture(e.pointerId);return;
  }
  if(tool==='polyline'){
    if(!polyDraft){
      pushUndo();
      polyDraft={id:uid(),type:'polyline',points:[[snap(w.x),snap(w.y)],[snap(w.x),snap(w.y)]],stroke:curStroke,width:curWidth,dash:'',arrow:false};
      objects.push(polyDraft);setSelOne(polyDraft.id);
    }else{
      polyDraft.points.push([snap(w.x),snap(w.y)]);
    }
    render();return;
  }
  if(tool==='text'){
    const o={id:uid(),type:'text',x:snap(w.x),y:snap(w.y)+14,text:'',size:16,font:'Segoe UI',bold:false,italic:false,rot:0,stroke:curStroke};
    pushUndo();objects.push(o);setSelOne(o.id);render();startTextEdit(o,true);return;
  }
});

canvas.addEventListener('pointermove',e=>{
  if(tool==='polyline'&&polyDraft){
    const w=toWorld(e);polyDraft.points[polyDraft.points.length-1]=[snap(w.x),snap(w.y)];render();return;
  }
  if(!drag)return;
  if(drag.mode==='pan'){view.x=drag.vx+(e.clientX-drag.sx);view.y=drag.vy+(e.clientY-drag.sy);applyView();return;}
  const w=toWorld(e);
  if(drag.mode==='move'){
    const dx=snap(w.x-drag.start.x), dy=snap(w.y-drag.start.y);
    drag.movers.forEach(m=>{if(!m.o.locked)moveObj(m.o,m.orig,dx,dy);});
    render();
  }else if(drag.mode==='marquee'){
    drag.moved=true;
    const x1=Math.min(drag.start.x,w.x),y1=Math.min(drag.start.y,w.y);
    drag.box={x:x1,y:y1,w:Math.abs(w.x-drag.start.x),h:Math.abs(w.y-drag.start.y)};
    drawMarquee(drag.box);
  }else if(drag.mode==='draw-line'){
    drag.o.x2=snap(w.x);drag.o.y2=snap(w.y);render();
  }else if(drag.mode==='draw-rect'){
    drag.o.x=Math.min(drag.ox,snap(w.x));drag.o.y=Math.min(drag.oy,snap(w.y));
    drag.o.w=Math.abs(snap(w.x)-drag.ox);drag.o.h=Math.abs(snap(w.y)-drag.oy);render();
  }else if(drag.mode==='draw-circle'){
    drag.o.rx=Math.abs(snap(w.x)-drag.cx);drag.o.ry=Math.abs(snap(w.y)-drag.cy);render();
  }else if(drag.mode==='handle'){
    handleResize(drag,w);render();buildInspector();
  }
});
function drawMarquee(box){
  render();
  if(!box)return;
  const r=mk('rect');
  r.setAttribute('x',box.x);r.setAttribute('y',box.y);r.setAttribute('width',box.w);r.setAttribute('height',box.h);
  r.setAttribute('fill','rgba(74,158,255,0.12)');r.setAttribute('stroke','#4a9eff');
  r.style.pointerEvents='none';
  r.setAttribute('stroke-width',1/view.scale);r.setAttribute('stroke-dasharray',`${4/view.scale} ${3/view.scale}`);
  gOverlay.appendChild(r);
}

canvas.addEventListener('pointerup',e=>{
  if(drag&&drag.mode==='draw-line'){if(drag.o.x1===drag.o.x2&&drag.o.y1===drag.o.y2){objects=objects.filter(o=>o!==drag.o);}}
  if(drag&&drag.mode==='draw-rect'&&drag.o.w<3&&drag.o.h<3){objects=objects.filter(o=>o!==drag.o);}
  if(drag&&drag.mode==='draw-circle'&&drag.o.rx<3&&drag.o.ry<3){objects=objects.filter(o=>o!==drag.o);}
  if(drag&&['draw-line','draw-rect','draw-circle'].includes(drag.mode)){setTool('select');buildInspector();}
  if(drag&&drag.mode==='pan'){canvas.style.cursor=tool==='select'?'default':'crosshair';}
  if(drag&&drag.mode==='marquee'){
    if(drag.moved&&drag.box&&(drag.box.w>3||drag.box.h>3)){
      // выделить все незакреплённые объекты, попавшие в рамку
      const b=drag.box;const inside=[];
      objects.forEach(o=>{if(o.locked)return;const ob=bbox(o);
        if(ob.x+ob.w>=b.x && ob.x<=b.x+b.w && ob.y+ob.h>=b.y && ob.y<=b.y+b.h)inside.push(o.id);});
      selSet=new Set(inside);selSyncSingle();buildInspector();
    }else{
      // одиночный клик по пустому — снять выделение
      clearSel();buildInspector();
    }
  }
  drag=null;render();
});

canvas.addEventListener('dblclick',e=>{
  if(tool==='polyline'&&polyDraft){
    polyDraft.points.pop();if(polyDraft.points.length<2)objects=objects.filter(o=>o!==polyDraft);
    polyDraft=null;setTool('select');buildInspector();render();return;
  }
});

function moveObj(o,orig,dx,dy){
  if(o.type==='line'||o.type==='arrow'){o.x1=orig.x1+dx;o.y1=orig.y1+dy;o.x2=orig.x2+dx;o.y2=orig.y2+dy;}
  else if(o.type==='polyline'){o.points=orig.points.map(p=>[p[0]+dx,p[1]+dy]);}
  else if(o.type==='circle'){o.x=orig.x+dx;o.y=orig.y+dy;}
  else{o.x=orig.x+dx;o.y=orig.y+dy;}
}
function scaleObjAbout(o,ox,oy,k){
  const sp=(x,y)=>[ox+(x-ox)*k, oy+(y-oy)*k];
  if(o.type==='line'||o.type==='arrow'){[o.x1,o.y1]=sp(o.x1,o.y1);[o.x2,o.y2]=sp(o.x2,o.y2);}
  else if(o.type==='polyline'){o.points=o.points.map(p=>sp(p[0],p[1]));}
  else if(o.type==='circle'){[o.x,o.y]=sp(o.x,o.y);o.rx*=k;o.ry*=k;}
  else if(o.type==='rect'){[o.x,o.y]=sp(o.x,o.y);o.w*=k;o.h*=k;}
  else if(o.type==='symbol'){[o.x,o.y]=sp(o.x,o.y);o.sx=(o.sx??1)*k;o.sy=(o.sy??1)*k;}
  else if(o.type==='text'){[o.x,o.y]=sp(o.x,o.y);o.size=Math.max(6,Math.round(o.size*k));}
  else if(o.type==='image'){[o.x,o.y]=sp(o.x,o.y);o.w*=k;o.h*=k;}
}
function handleResize(d,w){
  const o=d.o,or=d.orig;
  // ROTATE by dragging the rotate handle
  if(d.role==='rotate'){
    const b=bbox(or);const cx=b.x+b.w/2, cy=b.y+b.h/2;
    let ang=Math.atan2(w.y-cy,w.x-cx)*180/Math.PI+90;
    if(snapOn)ang=Math.round(ang/15)*15; // привязка поворота к 15°, Alt отключает
    o.rot=(ang%360+360)%360;
    return;
  }
  // 8-direction resize
  if(d.role&&d.role.startsWith('rz-')){
    const dir=d.role.slice(3);
    const b0=bbox(or);
    let nx=b0.x, ny=b0.y, nw=b0.w, nh=b0.h;
    const px=snap(w.x), py=snap(w.y);
    if(dir.includes('e')) nw=Math.max(6,px-b0.x);
    if(dir.includes('s')) nh=Math.max(6,py-b0.y);
    if(dir.includes('w')){nw=Math.max(6,b0.x+b0.w-px);nx=px;}
    if(dir.includes('n')){nh=Math.max(6,b0.y+b0.h-py);ny=py;}
    // text scales uniformly from corner
    if(o.type==='text'){
      const k=nh/b0.h; o.size=Math.max(6,Math.round(or.size*k));
      o.x=nx; o.y=ny+o.size; return;
    }
    if(o.type==='symbol'){
      const s=SYMBOLS[o.sym];
      o.sx=Math.max(0.1,nw/s.w); o.sy=Math.max(0.1,nh/s.h);
      o.x=nx; o.y=ny;
    }else if(o.type==='rect'||o.type==='image'){
      o.x=nx;o.y=ny;o.w=nw;o.h=nh;
    }else if(o.type==='circle'){
      o.rx=Math.max(3,nw/2);o.ry=Math.max(3,nh/2);o.x=nx+o.rx;o.y=ny+o.ry;
    }
    return;
  }
  // line / polyline endpoints
  if(d.role==='p1'){o.x1=snap(w.x);o.y1=snap(w.y);}
  else if(d.role==='p2'){o.x2=snap(w.x);o.y2=snap(w.y);}
  else if(d.role&&d.role.startsWith('pt')){const i=+d.role.slice(2);o.points[i]=[snap(w.x),snap(w.y)];}
}

function pickObject(target){
  const g=target.closest('g[data-id]');
  return g?g.dataset.id:null;
}

/* snapping to grid (hold Alt to disable) */
let snapOn=true;
let snapStep=5;
function snap(v){return snapOn?Math.round(v/snapStep)*snapStep:v;}

/* =========================================================================
   TEXT INLINE EDIT
   ========================================================================= */
let liveEdit=null;
function startTextEdit(o,isNew){
  if(liveEdit)endTextEdit();
  const ta=document.createElement('textarea');ta.className='live-edit';ta.value=o.text||'';
  const r=canvas.getBoundingClientRect();
  const sx=o.x*view.scale+view.x+r.left, sy=(o.y-o.size)*view.scale+view.y+r.top;
  ta.style.left=sx+'px';ta.style.top=sy+'px';
  ta.style.fontSize=(o.size*view.scale)+'px';
  ta.style.fontWeight=o.bold?'bold':'normal';ta.style.fontStyle=o.italic?'italic':'normal';
  ta.style.minWidth='80px';ta.style.color=o.stroke;ta.style.background='#fff';
  document.body.appendChild(ta);
  const auto=()=>{ta.style.height='auto';ta.style.height=(ta.scrollHeight)+'px';ta.style.width='auto';ta.style.width=(ta.scrollWidth+8)+'px';};
  auto();
  // hide the SVG version while editing so it doesn't double up
  o._editing=true;render();
  ta.oninput=()=>{o.text=ta.value;auto();};
  ta.onkeydown=ev=>{
    ev.stopPropagation();
    if(ev.key==='Escape'){ev.preventDefault();ta.blur();}
    // Enter переносит строку (textarea сам это делает). Завершение — Esc или клик вне.
    // Shift+Enter тоже перенос. Ctrl+Enter — завершить.
    if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();ta.blur();}
  };
  // defer focus + blur-binding so the originating click can't immediately blur it
  liveEdit={ta,o,isNew};
  requestAnimationFrame(()=>{
    ta.focus();
    if(isNew)ta.setSelectionRange(0,0); else ta.select();
    ta.onblur=()=>endTextEdit();
  });
}
function endTextEdit(){
  if(!liveEdit)return;
  const {ta,o,isNew}=liveEdit;
  o.text=ta.value;delete o._editing;ta.remove();liveEdit=null;
  if(isNew&&o.text.trim()===''){objects=objects.filter(x=>x!==o);clearSel();}
  buildInspector();render();
}

const COLORS=['#000000','#e23b3b','#1f6fe0','#1f9d4d','#e0a44a','#7d3fc0','#ffffff'];
function colorSwatches(current,onPick){
  return `<div class="swatches">${COLORS.map(c=>`<div class="sw ${c===current?'active':''}" style="background:${c};${c==='#ffffff'?'border:1px solid #555':''}" data-c="${c}"></div>`).join('')}</div>`;
}
function buildInspector(){

  if(selSet.size>1){

    let html=`<div class="insp-title">Выделено объектов: ${n}</div>

    inspector.innerHTML=html;
    inspector.querySelectorAll('.sw[data-c]').forEach(s=>s.onclick=()=>{
      pushUndo();const c=s.dataset.c;selSet.forEach(id=>{const o=objects.find(x=>x.id===id);if(o&&!o.locked&&o.type!=='image')o.stroke=c;});render();
      toast('Цвет применён к группе',1800,'🎨');
    });
    const gb=(sel,fn)=>{const el=inspector.querySelector(sel);if(el)el.onclick=fn;};
    gb('#gLock',()=>{pushUndo();selSet.forEach(id=>{const o=objects.find(x=>x.id===id);if(o)o.locked=true;});render();buildInspector();toast('Закреплено объектов: '+n,2200,'🔒');});
    gb('#gUnlock',()=>{pushUndo();selSet.forEach(id=>{const o=objects.find(x=>x.id===id);if(o)o.locked=false;});render();buildInspector();toast('Откреплено',2000,'🔓');});
    gb('#gDup',duplicateSel);
    gb('#gCopy',()=>{copySel();toast('Скопировано: '+n,1600,'📋');});

      <div class="field"><label>Заливка</label>
        <div class="swatches"><div class="sw ${curFill==='none'?'active':''}" data-fill="none" style="background:repeating-linear-gradient(45deg,#444,#444 3px,#666 3px,#666 6px)" title="нет"></div>
        ${COLORS.map(c=>`<div class="sw ${c===curFill?'active':''}" data-fill="${c}" style="background:${c};${c==='#ffffff'?'border:1px solid #555':''}"></div>`).join('')}</div></div>
      <div class="field"><label>Толщина линии: <span id="wv">${curWidth}</span></label>
        <input type="range" min="1" max="8" value="${curWidth}" id="defw" style="width:100%"></div>`;
  }else if(o.type==='image'){

    html+=`<div class="field"><label>Прозрачность: <span id="opv">${Math.round((o.opacity??1)*100)}%</span></label>

    bindIf('#ow','input',el=>{o.width=+el.value;inspector.querySelector('#wv').textContent=o.width;render();});
    bindIf('#odash','change',el=>{pushUndo();o.dash=el.checked?(o.type==='circle'?'8 5':'6 4'):'';render();});

    bindIf('#osy','input',el=>{const s=SYMBOLS[o.sym];o.sy=el.value/100;const n=inspector.querySelector('#osyN');if(n)n.value=Math.round(s.h*o.sy);render();});
    bindIf('#osxN','input',el=>{const s=SYMBOLS[o.sym];const px=Math.max(4,+el.value||4);o.sx=px/s.w;const r=inspector.querySelector('#osx');if(r)r.value=o.sx*100;render();});
    bindIf('#osyN','input',el=>{const s=SYMBOLS[o.sym];const px=Math.max(4,+el.value||4);o.sy=px/s.h;const r=inspector.querySelector('#osy');if(r)r.value=o.sy*100;render();});
    bindIf('#oprop','click',()=>{pushUndo();const m=Math.max(o.sx??1,o.sy??1);o.sx=o.sy=m;render();buildInspector();});
    bindIf('#otext','input',el=>{o.text=el.value;render();});
    bindIf('#osize','input',el=>{o.size=+el.value;inspector.querySelector('#tsv').textContent=o.size+'px';render();});
    bindIf('#ofont','change',el=>{pushUndo();o.font=el.value;render();});

   ========================================================================= */
function duplicateSel(){
  if(!selSet.size)return;
  pushUndo();const newIds=[];
  [...selSet].forEach(sid=>{const o=objects.find(x=>x.id===sid);if(!o)return;
    const c=JSON.parse(JSON.stringify(o));c.id=uid();delete c._editing;moveObj(c,c,20,20);objects.push(c);newIds.push(c.id);});
  selSet=new Set(newIds);selSyncSingle();render();buildInspector();
}
let clipboard=null;
function copySel(){
  if(!selSet.size)return;
  clipboard=[...selSet].map(sid=>{const o=objects.find(x=>x.id===sid);if(!o)return null;const c=JSON.parse(JSON.stringify(o));delete c._editing;return c;}).filter(Boolean);
}
function pasteClip(){
  if(!clipboard||!clipboard.length)return;
  pushUndo();const newIds=[];
  clipboard.forEach(src=>{const c=JSON.parse(JSON.stringify(src));c.id=uid();moveObj(c,c,25,25);objects.push(c);newIds.push(c.id);});
  selSet=new Set(newIds);selSyncSingle();render();buildInspector();
  // сдвигаем буфер для следующей вставки
  clipboard.forEach(src=>moveObj(src,src,25,25));
}
function deleteSel(){
  if(!selSet.size)return;pushUndo();
  objects=objects.filter(x=>!selSet.has(x.id));clearSel();render();buildInspector();
}

/* =========================================================================
   UNDO / REDO
   ========================================================================= */
function snapshot(){return JSON.stringify(objects);}
function pushUndo(){undoStack.push(snapshot());if(undoStack.length>100)undoStack.shift();redoStack.length=0;}
function undo(){if(!undoStack.length)return;redoStack.push(snapshot());objects=JSON.parse(undoStack.pop());clearSel();render();buildInspector();}
function redo(){if(!redoStack.length)return;undoStack.push(snapshot());objects=JSON.parse(redoStack.pop());clearSel();render();buildInspector();}

/* =========================================================================
   ZOOM / PAN
   ========================================================================= */
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const old=view.scale;
  const factor=e.deltaY<0?1.12:1/1.12;
  view.scale=Math.min(5,Math.max(0.15,old*factor));
  view.x=mx-(mx-view.x)*(view.scale/old);
  view.y=my-(my-view.y)*(view.scale/old);
  applyView();drawSelection();
},{passive:false});

/* =========================================================================
   KEYBOARD
   ========================================================================= */
window.addEventListener('keydown',e=>{
  if(liveEdit)return;
  if(e.code==='Space'){spaceDown=true;canvas.style.cursor='grab';}
  if(e.key==='Alt')snapOn=false;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.ctrlKey||e.metaKey){
    if(e.key==='z'){e.preventDefault();undo();}
    else if(e.key==='y'){e.preventDefault();redo();}
    else if(e.key==='d'){e.preventDefault();duplicateSel();}
    else if(e.key==='c'){e.preventDefault();copySel();}
    else if(e.key==='v'){e.preventDefault();pasteClip();}
    else if(e.key==='x'){e.preventDefault();copySel();deleteSel();}
    else if(e.key==='l'){e.preventDefault();if(selected){const o=objects.find(x=>x.id===selected);if(o){pushUndo();o.locked=!o.locked;render();buildInspector();}}}
    return;
  }
  if(e.key==='Delete'||e.key==='Backspace'){deleteSel();}
  else if(e.key==='v')setTool('select');
  else if(e.key==='l')setTool('line');
  else if(e.key==='p')setTool('polyline');
  else if(e.key==='a')setTool('arrow');
  else if(e.key==='r')setTool('rect');
  else if(e.key==='c')setTool('circle');
  else if(e.key==='d')setTool('dashcircle');
  else if(e.key==='t')setTool('text');
  // arrow nudge
  else if(selected&&e.key.startsWith('Arrow')){
    const o=objects.find(x=>x.id===selected);if(!o)return;
    if(o.locked){e.preventDefault();return;} // закреплён
    e.preventDefault();
    const d=e.shiftKey?10:1;const dx=e.key==='ArrowLeft'?-d:e.key==='ArrowRight'?d:0;const dy=e.key==='ArrowUp'?-d:e.key==='ArrowDown'?d:0;
    moveObj(o,JSON.parse(JSON.stringify(o)),dx,dy);render();
  }
});
window.addEventListener('keyup',e=>{if(e.code==='Space'){spaceDown=false;canvas.style.cursor=tool==='select'?'default':'crosshair';}if(e.key==='Alt')snapOn=true;});

function contentBounds(){
  if(!objects.length)return{x:0,y:0,w:800,h:600};
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  objects.forEach(o=>{const b=bbox(o);x1=Math.min(x1,b.x);y1=Math.min(y1,b.y);x2=Math.max(x2,b.x+b.w);y2=Math.max(y2,b.y+b.h);});
  const pad=40;return{x:x1-pad,y:y1-pad,w:(x2-x1)+pad*2,h:(y2-y1)+pad*2};
}
function buildExportSVG(opts={}){
  const b=opts.area?{x:opts.area.x,y:opts.area.y,w:opts.area.w,h:opts.area.h}:contentBounds();
  const svg=mk('svg');
  svg.setAttribute('xmlns',NS);
  svg.setAttribute('viewBox',`${b.x} ${b.y} ${b.w} ${b.h}`);
  svg.setAttribute('width',b.w);svg.setAttribute('height',b.h);
  const d=mk('defs');
  let markersXml='';
  _arrowColors.forEach(id=>{
    const m=defs.querySelector('#'+id);
    if(m)markersXml+=m.outerHTML;
  });
  // grid pattern for export if requested
  if(opts.grid){
    markersXml+=`<pattern id="egrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M5 0 V25 M10 0 V25 M15 0 V25 M20 0 V25 M0 5 H25 M0 10 H25 M0 15 H25 M0 20 H25" fill="none" stroke="#eeeeec" stroke-width="0.6"/>
      <path d="M25 0 L0 0 0 25" fill="none" stroke="#dcdcd8" stroke-width="1"/></pattern>`;
  }
  d.innerHTML=markersXml;
  svg.appendChild(d);
  const bg=mk('rect');bg.setAttribute('x',b.x);bg.setAttribute('y',b.y);bg.setAttribute('width',b.w);bg.setAttribute('height',b.h);bg.setAttribute('fill','#fff');svg.appendChild(bg);
  if(opts.grid){const gr=mk('rect');gr.setAttribute('x',b.x);gr.setAttribute('y',b.y);gr.setAttribute('width',b.w);gr.setAttribute('height',b.h);gr.setAttribute('fill','url(#egrid)');svg.appendChild(gr);}
  // temporarily hide background images if bg disabled
  const hidden=[];
  if(opts.bg===false){objects.forEach(o=>{if(o.type==='image'){hidden.push([o,o._hide]);o._hide=true;}});}
  const tmp=mk('g');
  const sel=selected;selected=null;
  render();
  tmp.innerHTML=gObjects.innerHTML;svg.appendChild(tmp);
  selected=sel;
  hidden.forEach(([o,prev])=>{if(prev)o._hide=prev;else delete o._hide;});
  render();
  return{svg,b};
}
function svgString(opts){const {svg}=buildExportSVG(opts);return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(svg);}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Файл сохранён: '+name,2600,'💾');}

function exportSVG(opts={}){download((exportName||'schema')+'.svg',new Blob([svgString(opts)],{type:'image/svg+xml'}));}

function printSchema(opts={}){
  const {b}=buildExportSVG(opts);const str=svgString(opts);
  const img=new Image();const scale=2.5;
  img.onload=()=>{
    const cv=document.createElement('canvas');cv.width=Math.round(b.w*scale);cv.height=Math.round(b.h*scale);
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.scale(scale,scale);ctx.drawImage(img,0,0);
    const png=cv.toDataURL('image/png');
    const landscape = b.w>b.h;
    const ifr=document.createElement('iframe');
    ifr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
    document.body.appendChild(ifr);
    const doc=ifr.contentWindow.document;
    doc.open();
    doc.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title></title>
      <style>
        @page{size:${landscape?'landscape':'portrait'};margin:0}
        html,body{margin:0;padding:0}
        body{display:flex;align-items:center;justify-content:center;min-height:100vh}
        img{max-width:100%;max-height:100vh;display:block}
      </style></head><body><img src="${png}"></body></html>`);
    doc.close();
    const finish=()=>{ifr.contentWindow.focus();ifr.contentWindow.print();
      setTimeout(()=>ifr.remove(),1500);};
    if(ifr.contentWindow.document.readyState==='complete')setTimeout(finish,150);
    else ifr.onload=()=>setTimeout(finish,150);

  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(str)));
}

function exportPNG(opts={}){

/* Simpler & robust: re-encode to JPEG and embed with DCTDecode */
function exportPDF(opts={}){
  const {b}=buildExportSVG(opts);const str=svgString(opts);
  const img=new Image();const scale=2.5;
  img.onload=()=>{
    const cv=document.createElement('canvas');cv.width=Math.round(b.w*scale);cv.height=Math.round(b.h*scale);
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.scale(scale,scale);ctx.drawImage(img,0,0);
    const jpeg=cv.toDataURL('image/jpeg',0.92);
    const raw=atob(jpeg.split(',')[1]);const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const enc=new TextEncoder();const parts=[];const off=[];let pos=0;
    const push=s=>{const e=enc.encode(s);parts.push(e);pos+=e.length;};
    const pushB=bb=>{parts.push(bb);pos+=bb.length;};
    const k=Math.min(800/b.w,800/b.h,1.2);const pw=(b.w*k).toFixed(2),ph=(b.h*k).toFixed(2);
    push("%PDF-1.4\n");
    off[1]=pos;push("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
    off[2]=pos;push("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
    off[3]=pos;push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
    off[4]=pos;push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);
    pushB(bytes);push("\nendstream\nendobj\n");
    const content=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    off[5]=pos;push(`5 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    const xref=pos;push(`xref\n0 6\n0000000000 65535 f \n`);
    for(let i=1;i<=5;i++)push(String(off[i]).padStart(10,'0')+" 00000 n \n");
    push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    let total=0;parts.forEach(p=>total+=p.length);const out=new Uint8Array(total);let o=0;parts.forEach(p=>{out.set(p,o);o+=p.length;});
    download((exportName||'schema')+'.pdf',new Blob([out],{type:'application/pdf'}));
  };
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(str)));
}


function exportJPEG(opts={}){
  const {b}=buildExportSVG(opts);const str=svgString(opts);
  const img=new Image();const scale=2;
  img.onload=()=>{
    const cv=document.createElement('canvas');cv.width=Math.round(b.w*scale);cv.height=Math.round(b.h*scale);
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.scale(scale,scale);ctx.drawImage(img,0,0);

/* =========================================================================
   BACKGROUND IMAGE (подложка)

function loadBackgroundImage(el){
  const f=el.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      pushUndo();
      // вписываем в видимую область, сохраняя пропорции
      const maxW=700, k=Math.min(1,maxW/im.width);
      const o={id:uid(),type:'image',href:rd.result,
        x:snap(-view.x/view.scale+80),y:snap(-view.y/view.scale+80),
        w:im.width*k,h:im.height*k,rot:0,opacity:1,locked:false};
      objects.unshift(o); // в самый низ (под все)
      setSelOne(o.id);render();buildInspector();
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(f);el.value='';
}

let exportArea=null; // {x,y,w,h} в world-координатах
let areaSelecting=false;
function startAreaSelect(done){
  areaSelecting=true;
  const hint=document.createElement('div');hint.id='areaHint';
  hint.textContent='Выделите область — растяните рамку мышью. Пробел+тяни — двигать холст. Esc — отмена.';
  document.body.appendChild(hint);
  canvas.style.cursor='crosshair';
  let box=null, start=null, panning=null, spaceHeld=false;
  const rectEl=mk('rect');
  rectEl.setAttribute('fill','rgba(74,158,255,0.12)');
  rectEl.setAttribute('stroke','#4a9eff');rectEl.setAttribute('stroke-dasharray','6 4');
  gOverlay.appendChild(rectEl);

  function down(e){
    e.stopPropagation();e.preventDefault();
    if(spaceHeld){ // панорама
      panning={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};
      canvas.style.cursor='grabbing';return;
    }
    const w=toWorld(e);start={x:w.x,y:w.y};box={x:w.x,y:w.y,w:0,h:0};
  }
  function move(e){
    e.stopPropagation();
    if(panning){view.x=panning.vx+(e.clientX-panning.sx);view.y=panning.vy+(e.clientY-panning.sy);applyView();return;}
    if(!start)return;
    const w=toWorld(e);
    box={x:Math.min(start.x,w.x),y:Math.min(start.y,w.y),w:Math.abs(w.x-start.x),h:Math.abs(w.y-start.y)};
    rectEl.setAttribute('x',box.x);rectEl.setAttribute('y',box.y);
    rectEl.setAttribute('width',box.w);rectEl.setAttribute('height',box.h);
    rectEl.setAttribute('stroke-width',1.5/view.scale);
  }
  function up(e){
    e.stopPropagation();
    if(panning){panning=null;start=null;box=null;canvas.style.cursor=spaceHeld?'grab':'crosshair';return;}
    if(box&&box.w>5&&box.h>5){exportArea={...box};}
    cleanup();if(done)done();
  }
  function key(e){
    if(e.key==='Escape'){cleanup();if(done)done();}
    if(e.code==='Space'&&!spaceHeld){spaceHeld=true;if(!panning)canvas.style.cursor='grab';e.preventDefault();}
  }
  function keyUp(e){
    if(e.code==='Space'){spaceHeld=false;if(!panning)canvas.style.cursor='crosshair';}
  }
  function cleanup(){
    areaSelecting=false;
    canvas.removeEventListener('pointerdown',down,true);
    canvas.removeEventListener('pointermove',move,true);
    canvas.removeEventListener('pointerup',up,true);
    window.removeEventListener('keydown',key,true);
    window.removeEventListener('keyup',keyUp,true);
    rectEl.remove();hint.remove();
    canvas.style.cursor=tool==='select'?'grab':'crosshair';
    render();
  }
  canvas.addEventListener('pointerdown',down,true);
  canvas.addEventListener('pointermove',move,true);
  canvas.addEventListener('pointerup',up,true);
  window.addEventListener('keydown',key,true);
  window.addEventListener('keyup',keyUp,true);
}

function importSVG(el){
  const f=el.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{ parseSVGText(rd.result); }
    catch(err){ alert('Не удалось разобрать SVG: '+err.message); }
  };
  rd.readAsText(f);el.value='';
}
function parseSVGText(text){
  const doc=new DOMParser().parseFromString(text,'image/svg+xml');
  const svg=doc.querySelector('svg');
  if(!svg){alert('Файл не похож на SVG');return;}
  if(doc.querySelector('parsererror')){alert('Ошибка чтения SVG-файла');return;}

  // --- нормализация масштаба: viewBox против реальных width/height ---
  // единицы -> px (96dpi)
  function lenToPx(v){
    if(v==null)return null;
    const m=String(v).trim().match(/^([\d.]+)\s*(mm|cm|in|pt|pc|px|)$/i);
    if(!m)return parseFloat(v)||null;
    const n=parseFloat(m[1]);const u=(m[2]||'px').toLowerCase();
    const k={px:1,mm:96/25.4,cm:96/2.54,in:96,pt:96/72,pc:16}[u]||1;
    return n*k;
  }
  let baseScale=1;
  const vb=(svg.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number);
  const wAttr=lenToPx(svg.getAttribute('width'));
  const hAttr=lenToPx(svg.getAttribute('height'));
  if(vb.length===4 && vb[2]>0 && vb[3]>0){
    // если есть и реальные размеры — масштаб = реальный/viewBox
    if(wAttr&&hAttr){ baseScale=((wAttr/vb[2])+(hAttr/vb[3]))/2; }
    // viewBox огромный (тысячи) а реальных размеров нет -> ужать к разумному
    else if(vb[2]>1500||vb[3]>1500){ baseScale=600/Math.max(vb[2],vb[3]); }
  }
  // защита от абсурда
  if(!isFinite(baseScale)||baseScale<=0)baseScale=1;

  const added=[];
  const baseColor='#000000';

  function num(v,d){const n=parseFloat(v);return isNaN(n)?d:n;}
  function matFromEl(node){
    // собираем transform этого узла
    let m=new DOMMatrix();
    const tr=node.getAttribute&&node.getAttribute('transform');
    if(tr){try{m=new DOMMatrix(trToMatrixStr(tr));}catch(_){}}
    return m;
  }
  function trToMatrixStr(tr){
    // DOMMatrix понимает CSS-подобные transform-функции через конструктор только для matrix();
    // поэтому применим через временный элемент
    const g=document.createElementNS(NS,'g');g.setAttribute('transform',tr);
    // используем consolidate
    svg.appendChild(g);
    let m=new DOMMatrix();
    try{const t=g.transform.baseVal.consolidate();if(t)m=DOMMatrix.fromMatrix(t.matrix);}catch(_){}
    g.remove();
    return m.toString();
  }
  function applyM(m,x,y){return {x:m.a*x+m.c*y+m.e, y:m.b*x+m.d*y+m.f};}
  function avgScale(m){return (Math.hypot(m.a,m.b)+Math.hypot(m.c,m.d))/2;}

  function walk(node,m){
    let cm=m;
    if(node.nodeType===1){
      const lm=matFromEl(node);
      cm=m.multiply(lm);
      const tag=node.tagName.toLowerCase();
      const st=node.getAttribute('stroke')||(node.style&&node.style.stroke)||baseColor;
      const sw=num(node.getAttribute('stroke-width')||(node.style&&node.style.strokeWidth),1)*avgScale(cm);
      const fillRaw=node.getAttribute('fill')||(node.style&&node.style.fill)||'';
      const fill=(!fillRaw||fillRaw==='none')?'none':fillRaw;
      const dash=(node.getAttribute('stroke-dasharray')&&node.getAttribute('stroke-dasharray')!=='none')?'6 4':'';
      const strokeCol=(st==='none')?'#000000':st;

      if(tag==='line'){
        const p1=applyM(cm,num(node.getAttribute('x1'),0),num(node.getAttribute('y1'),0));
        const p2=applyM(cm,num(node.getAttribute('x2'),0),num(node.getAttribute('y2'),0));
        added.push({id:uid(),type:'line',x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,stroke:strokeCol,width:Math.max(1,sw),dash});
      }else if(tag==='rect'){
        const x=num(node.getAttribute('x'),0),y=num(node.getAttribute('y'),0),w=num(node.getAttribute('width'),0),h=num(node.getAttribute('height'),0);
        const p=applyM(cm,x,y);const sc=avgScale(cm);
        added.push({id:uid(),type:'rect',x:p.x,y:p.y,w:w*sc,h:h*sc,rot:0,stroke:strokeCol,fill,width:Math.max(1,sw),dash});
      }else if(tag==='circle'){
        const cx=num(node.getAttribute('cx'),0),cy=num(node.getAttribute('cy'),0),r=num(node.getAttribute('r'),0);
        const p=applyM(cm,cx,cy);const sc=avgScale(cm);
        added.push({id:uid(),type:'circle',x:p.x,y:p.y,rx:r*sc,ry:r*sc,stroke:strokeCol,fill,width:Math.max(1,sw),dash});
      }else if(tag==='ellipse'){
        const cx=num(node.getAttribute('cx'),0),cy=num(node.getAttribute('cy'),0),rx=num(node.getAttribute('rx'),0),ry=num(node.getAttribute('ry'),0);
        const p=applyM(cm,cx,cy);const sc=avgScale(cm);
        added.push({id:uid(),type:'circle',x:p.x,y:p.y,rx:rx*sc,ry:ry*sc,stroke:strokeCol,fill,width:Math.max(1,sw),dash});
      }else if(tag==='polyline'||tag==='polygon'){
        const raw=(node.getAttribute('points')||'').trim().split(/[\s,]+/).map(Number);
        const pts=[];for(let i=0;i+1<raw.length;i+=2){const p=applyM(cm,raw[i],raw[i+1]);pts.push([p.x,p.y]);}
        if(tag==='polygon'&&pts.length)pts.push(pts[0].slice());
        if(pts.length>=2)added.push({id:uid(),type:'polyline',points:pts,stroke:strokeCol,width:Math.max(1,sw),dash,arrow:false});
      }else if(tag==='text'){
        const x=num(node.getAttribute('x'),0),y=num(node.getAttribute('y'),0);
        const p=applyM(cm,x,y);const sc=avgScale(cm);
        const fs=num(node.getAttribute('font-size')||(node.style&&node.style.fontSize),16)*sc;
        added.push({id:uid(),type:'text',x:p.x,y:p.y,text:(node.textContent||'').trim(),size:Math.max(6,Math.round(fs)),font:'Segoe UI',bold:false,italic:false,rot:0,stroke:strokeCol==='none'?'#000':strokeCol});
      }else if(tag==='path'){
        // путь сохраняем как inline-символ (пресет) с трансформом
        importPath(node,cm,strokeCol,fill,Math.max(1,sw),dash);
      }
      // рекурсия по детям
      node.childNodes.forEach(ch=>walk(ch,cm));
    }
  }

  function importPath(node,cm,stroke,fill,sw,dash){
    const d=node.getAttribute('d');if(!d)return;
    // вычислим bbox через временный path в видимом svg
    const tmp=document.createElementNS(NS,'path');tmp.setAttribute('d',d);
    const wrap=document.createElementNS(NS,'svg');wrap.style.position='absolute';wrap.style.opacity='0';wrap.style.width='10px';wrap.style.height='10px';
    wrap.appendChild(tmp);document.body.appendChild(wrap);
    let bb;try{bb=tmp.getBBox();}catch(_){bb=null;}
    document.body.removeChild(wrap);
    if(!bb||bb.width<0.5&&bb.height<0.5){return;}
    const sc=avgScale(cm);
    const p0=applyM(cm,bb.x,bb.y);
    const w=Math.max(2,bb.width*sc), h=Math.max(2,bb.height*sc);
    // svgTemplate: путь, сдвинутый в локальные координаты (вычитаем bb.x,bb.y), масштаб через viewBox
    const tpl=`<g transform="scale(${sc}) translate(${-bb.x},${-bb.y})"><path d="${d.replace(/"/g,"'")}" fill="${fill}" stroke="\${c}" stroke-width="${sw/sc}" ${dash?`stroke-dasharray="6 4"`:''}/></g>`;
    const key='svgpath_'+(idCounter++);
    const wLoc=Math.round(w/sc)||Math.round(w), hLoc=Math.round(h/sc)||Math.round(h);
    userPresets[key]={label:'Контур',w:wLoc,h:hLoc,svgTemplate:tpl,_imported:true};
    SYMBOLS[key]={w:wLoc, h:hLoc, label:'Контур', cat:'Импорт', draw:(c)=>tpl.split('${c}').join(c||stroke||'#000'), _preset:true, _imported:true};
    added.push({id:uid(),type:'symbol',sym:key,x:p0.x,y:p0.y,sx:sc,sy:sc,rot:0,stroke:stroke==='none'?'#000':stroke,fill});
  }

  walk(svg,new DOMMatrix().scale(baseScale));

  if(!added.length){alert('В SVG не найдено объектов для импорта');return;}
  pushUndo();
  // итоговый bbox импортированного
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  added.forEach(o=>{const b=bbox(o);minx=Math.min(minx,b.x);miny=Math.min(miny,b.y);maxx=Math.max(maxx,b.x+b.w);maxy=Math.max(maxy,b.y+b.h);});
  const curW=maxx-minx, curH=maxy-miny, curMax=Math.max(curW,curH);
  // если схема всё равно слишком большая или крошечная — подгоняем к ~700px по большей стороне
  let fit=1;
  if(curMax>800) fit=600/curMax;
  else if(curMax<40 && curMax>0) fit=200/curMax;
  if(fit!==1){
    added.forEach(o=>scaleObjAbout(o,minx,miny,fit));
    // пересчёт bbox
    minx=1e9;miny=1e9;added.forEach(o=>{const b=bbox(o);minx=Math.min(minx,b.x);miny=Math.min(miny,b.y);});
  }
  const offx=80-minx, offy=80-miny;
  added.forEach(o=>moveObj(o,JSON.parse(JSON.stringify(o)),offx,offy));
  objects=objects.concat(added);
  clearSel();
  if(Object.values(userPresets).some(p=>p._imported))rebuildPresetsPalette();
  render();buildInspector();
  toast('Импортировано объектов: '+added.length+(fit!==1?' · масштаб подогнан':''),3200,'📥');
}

function openProject(el){
  const f=el.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);pushUndo();objects=d.objects||[];idCounter=d.idCounter||1000;
    if(d.presets){userPresets=d.presets;rebuildPresetsPalette();}
    clearSel();render();buildInspector();}catch(err){alert('Не удалось открыть файл проекта');}};
  rd.readAsText(f);el.value='';
}
