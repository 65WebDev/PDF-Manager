  ov.onclick=(e)=>{if(e.target===ov)ov.remove();};

  function pePt(e){const r=pc.getBoundingClientRect();return {x:snapV(e.clientX-r.left),y:snapV(e.clientY-r.top)};}
  function peRaw(e){const r=pc.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  function peBox(s){
    if(s.t==='poly'){const xs=s.pts.map(p=>p[0]),ys=s.pts.map(p=>p[1]);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};}
    return{x:Math.min(s.x1,s.x2),y:Math.min(s.y1,s.y2),w:Math.abs(s.x2-s.x1),h:Math.abs(s.y2-s.y1)};
  }
  function peHit(p){
    // ищем верхний примитив под точкой (по bbox с допуском)
    for(let i=peShapes.length-1;i>=0;i--){const b=peBox(peShapes[i]);const m=6;
      if(p.x>=b.x-m&&p.x<=b.x+b.w+m&&p.y>=b.y-m&&p.y<=b.y+b.h+m)return i;}
    return -1;
  }
  function peMoveShape(s,dx,dy){
    if(s.t==='poly')s.pts=s.pts.map(p=>[p[0]+dx,p[1]+dy]);
    else{s.x1+=dx;s.y1+=dy;s.x2+=dx;s.y2+=dy;}
  }
  function drawPe(){
    let html=peShapes.map((s,i)=>peSvg(s)).join('')+(peDraft?peSvg(peDraft):'')+(pePoly?peSvg(pePoly):'');
    if(peTool==='select'&&peSel>=0&&peShapes[peSel]){
      const b=peBox(peShapes[peSel]);const rot=peShapes[peSel].rot||0;
      const cx=b.x+b.w/2, cy=b.y+b.h/2;
      html+=`<g transform="rotate(${rot},${cx},${cy})">`;
      html+=`<rect x="${b.x-4}" y="${b.y-4}" width="${b.w+8}" height="${b.h+8}" fill="none" stroke="#4a9eff" stroke-width="1.2" stroke-dasharray="4 3"/>`;
      // 8 resize handles
      const hs=7;
      const pts=[['nw',b.x,b.y],['n',b.x+b.w/2,b.y],['ne',b.x+b.w,b.y],['e',b.x+b.w,b.y+b.h/2],
        ['se',b.x+b.w,b.y+b.h],['s',b.x+b.w/2,b.y+b.h],['sw',b.x,b.y+b.h],['w',b.x,b.y+b.h/2]];
      pts.forEach(([role,hx,hy])=>{html+=`<rect class="pehandle" data-role="rz-${role}" x="${hx-hs/2}" y="${hy-hs/2}" width="${hs}" height="${hs}" fill="#fff" stroke="#4a9eff" stroke-width="1.5"/>`;});
      // rotate handle
      const ry=b.y-22;
      html+=`<line x1="${cx}" y1="${b.y}" x2="${cx}" y2="${ry}" stroke="#4a9eff" stroke-width="1.2"/>`;
      html+=`<circle class="pehandle" data-role="rotate" cx="${cx}" cy="${ry}" r="6" fill="#4a9eff" stroke="#fff" stroke-width="1.5"/>`;
      html+=`</g>`;
    }
    peg.innerHTML=html;
  }
  function peSvg(s){
    const c=s.c||'#111',w=s.w||2,f=s.f||'none',da=s.dash?'stroke-dasharray="7 4"':'';
    const b=peBox(s);const rot=s.rot||0;
    const tr=rot?`transform="rotate(${rot},${b.x+b.w/2},${b.y+b.h/2})"`:'';
    if(s.t==='line')return `<line x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}" stroke="${c}" stroke-width="${w}" ${da} ${tr}/>`;
    if(s.t==='rect')return `<rect x="${Math.min(s.x1,s.x2)}" y="${Math.min(s.y1,s.y2)}" width="${Math.abs(s.x2-s.x1)}" height="${Math.abs(s.y2-s.y1)}" fill="${f}" stroke="${c}" stroke-width="${w}" ${da} ${tr}/>`;
    if(s.t==='circle'){const rx=Math.abs(s.x2-s.x1)/2,ry2=Math.abs(s.y2-s.y1)/2;return `<ellipse cx="${Math.min(s.x1,s.x2)+rx}" cy="${Math.min(s.y1,s.y2)+ry2}" rx="${rx}" ry="${ry2}" fill="${f}" stroke="${c}" stroke-width="${w}" ${da} ${tr}/>`;}
    if(s.t==='poly')return `<polyline points="${s.pts.map(p=>p.join(',')).join(' ')}" fill="${f}" stroke="${c}" stroke-width="${w}" ${da} ${tr}/>`;
    return '';
  }
  pc.addEventListener('pointerdown',e=>{
    const p=pePt(e), raw=peRaw(e);
    if(peTool==='select'){
      // клик по маркеру?
      const hEl=e.target.closest('.pehandle');
      if(hEl&&peSel>=0){
        peHandle={role:hEl.dataset.role,orig:JSON.parse(JSON.stringify(peShapes[peSel])),start:p};
        pc.setPointerCapture(e.pointerId);return;
      }
      const hit=peHit(raw);
      peSel=hit;
      if(hit>=0){
        const s=peShapes[hit];
        peColor=s.c||'#000000';peWidth=s.w||2;peFill=s.f||'none';peDash=!!s.dash;
        ov.querySelector('#peW').value=peWidth;ov.querySelector('#peWv').textContent=peWidth;
        ov.querySelector('#peDash').checked=peDash;
        peMove={start:p,orig:JSON.parse(JSON.stringify(s))};
        pc.setPointerCapture(e.pointerId);
      }
      drawPe();return;
    }
    if(peTool==='poly'){
      if(!pePoly){pePoly={t:'poly',pts:[[p.x,p.y],[p.x,p.y]],c:peColor,w:peWidth,f:peFill,dash:peDash};}
      else pePoly.pts.push([p.x,p.y]);
      drawPe();return;
    }
    peDraft={t:peTool,x1:p.x,y1:p.y,x2:p.x,y2:p.y,c:peColor,w:peWidth,f:peFill,dash:peDash};
    pc.setPointerCapture(e.pointerId);
  });
  pc.addEventListener('pointermove',e=>{
    const p=pePt(e), raw=peRaw(e);
    if(peHandle&&peSel>=0){
      peApplyHandle(peShapes[peSel],peHandle,p,raw);drawPe();return;
    }
    if(peMove&&peSel>=0){
      const s=peShapes[peSel];const o=peMove.orig;
      const dx=p.x-peMove.start.x, dy=p.y-peMove.start.y;
      if(s.t==='poly')s.pts=o.pts.map(pt=>[pt[0]+dx,pt[1]+dy]);
      else{s.x1=o.x1+dx;s.y1=o.y1+dy;s.x2=o.x2+dx;s.y2=o.y2+dy;}
      drawPe();return;
    }
    if(pePoly){pePoly.pts[pePoly.pts.length-1]=[p.x,p.y];drawPe();return;}
    if(peDraft){peDraft.x2=p.x;peDraft.y2=p.y;drawPe();}
  });
  pc.addEventListener('pointerup',e=>{
    if(peHandle){peHandle=null;return;}
    if(peMove){peMove=null;return;}
    if(peDraft){if(Math.abs(peDraft.x2-peDraft.x1)>2||Math.abs(peDraft.y2-peDraft.y1)>2)peShapes.push(peDraft);peDraft=null;drawPe();}
  });
  function peApplyHandle(s,h,p,raw){
    const o=h.orig;const b0=peBox(o);
    if(h.role==='rotate'){
      const cx=b0.x+b0.w/2, cy=b0.y+b0.h/2;
      let ang=Math.atan2(raw.y-cy,raw.x-cx)*180/Math.PI+90;
      if(peSnapOn)ang=Math.round(ang/15)*15;
      s.rot=(ang%360+360)%360;return;
    }
    // resize
    const dir=h.role.slice(3);
    let nx=b0.x,ny=b0.y,nw=b0.w,nh=b0.h;
    if(dir.includes('e'))nw=Math.max(4,p.x-b0.x);
    if(dir.includes('s'))nh=Math.max(4,p.y-b0.y);
    if(dir.includes('w')){nw=Math.max(4,b0.x+b0.w-p.x);nx=p.x;}
    if(dir.includes('n')){nh=Math.max(4,b0.y+b0.h-p.y);ny=p.y;}
    // масштабируем координаты примитива из orig bbox в новый bbox
    const sx=nw/(b0.w||1), sy=nh/(b0.h||1);
    if(s.t==='poly'){
      s.pts=o.pts.map(pt=>[nx+(pt[0]-b0.x)*sx, ny+(pt[1]-b0.y)*sy]);
    }else{
      s.x1=nx+(o.x1-b0.x)*sx; s.y1=ny+(o.y1-b0.y)*sy;
      s.x2=nx+(o.x2-b0.x)*sx; s.y2=ny+(o.y2-b0.y)*sy;
    }
  }
  pc.addEventListener('dblclick',e=>{
    if(pePoly){pePoly.pts.pop();if(pePoly.pts.length>=2)peShapes.push(pePoly);pePoly=null;drawPe();}
  });
  // Delete удаляет выбранный примитив
  ov.addEventListener('keydown',e=>{
    if((e.key==='Delete'||e.key==='Backspace')&&peSel>=0){peShapes.splice(peSel,1);peSel=-1;drawPe();}
  });
  ov.tabIndex=0;

  ov.querySelector('#peSave').onclick=()=>{
    if(pePoly){pePoly.pts.pop();if(pePoly.pts.length>=2)peShapes.push(pePoly);pePoly=null;}
    if(!peShapes.length){alert('Нарисуйте фигуру');return;}
    const name=(ov.querySelector('#peName').value||'').trim()||('Фигура '+(Object.keys(userPresets).length+1));
    let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
    peShapes.forEach(s=>{
      if(s.t==='poly'){s.pts.forEach(p=>{x1=Math.min(x1,p[0]);y1=Math.min(y1,p[1]);x2=Math.max(x2,p[0]);y2=Math.max(y2,p[1]);});}
      else{x1=Math.min(x1,s.x1,s.x2);y1=Math.min(y1,s.y1,s.y2);x2=Math.max(x2,s.x1,s.x2);y2=Math.max(y2,s.y1,s.y2);}
    });
    const pad=4;x1-=pad;y1-=pad;x2+=pad;y2+=pad;
    const w=Math.max(8,x2-x1),h=Math.max(8,y2-y1);
    const norm=peShapes.map(s=>{
      const sh=JSON.parse(JSON.stringify(s));
      if(sh.t==='poly')sh.pts=sh.pts.map(p=>[+(p[0]-x1).toFixed(1),+(p[1]-y1).toFixed(1)]);
      else{sh.x1=+(sh.x1-x1).toFixed(1);sh.y1=+(sh.y1-y1).toFixed(1);sh.x2=+(sh.x2-x1).toFixed(1);sh.y2=+(sh.y2-y1).toFixed(1);}
      return sh;
    });
    // если у фигуры свой цвет (не чёрный) — оставляем фикс, иначе \${c} чтобы перекрашивалась
    const colorSlot=(c)=> (c&&c!=='#000000'&&c!=='#111') ? c : '${c}';
    const svg=norm.map(s=>{
      const c=colorSlot(s.c),w2=s.w||2,f=s.f||'none',da=s.dash?' stroke-dasharray="7 4"':'';
      // локальный bbox для центра поворота
      let bx,by,bw,bh;
      if(s.t==='poly'){const xs=s.pts.map(p=>p[0]),ys=s.pts.map(p=>p[1]);bx=Math.min(...xs);by=Math.min(...ys);bw=Math.max(...xs)-bx;bh=Math.max(...ys)-by;}
      else{bx=Math.min(s.x1,s.x2);by=Math.min(s.y1,s.y2);bw=Math.abs(s.x2-s.x1);bh=Math.abs(s.y2-s.y1);}
      const tr=s.rot?` transform="rotate(${s.rot},${(bx+bw/2).toFixed(1)},${(by+bh/2).toFixed(1)})"`:'';
      if(s.t==='line')return `<line x1="${s.x1}" y1="${s.y1}" x2="${s.x2}" y2="${s.y2}" stroke="${c}" stroke-width="${w2}"${da}${tr}/>`;
      if(s.t==='rect')return `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="${f}" stroke="${c}" stroke-width="${w2}"${da}${tr}/>`;
      if(s.t==='circle'){const rx=bw/2,ry=bh/2;return `<ellipse cx="${bx+rx}" cy="${by+ry}" rx="${rx}" ry="${ry}" fill="${f}" stroke="${c}" stroke-width="${w2}"${da}${tr}/>`;}
      if(s.t==='poly')return `<polyline points="${s.pts.map(p=>p.join(',')).join(' ')}" fill="${f}" stroke="${c}" stroke-width="${w2}"${da}${tr}/>`;
      return '';
    }).join('');
    const key='preset_'+Date.now();
    userPresets[key]={label:name,w:Math.round(w),h:Math.round(h),svgTemplate:svg};
    rebuildPresetsPalette();
    ov.remove();
    toast('Фигура «'+name+'» добавлена в палитру',2800,'⭐');
  };
  drawPe();
}


/* =========================================================================
   INIT
   ========================================================================= */
buildPalette();
resize();
view.x=60;view.y=80;applyView();
render();
buildInspector();

/* ===== интерактивный туториал ===== */
const TOUR=[
  {sel:'#palette', title:'Палитра элементов', body:'Слева — готовые значки: задвижки, резервуары, насосы, люди, камеры. Кликни значок, потом кликни на холст — он появится.', pos:'right'},
  {sel:'#toolbar', title:'Инструменты рисования', body:'Сверху — линии, стрелки, фигуры, текст и <b>красный пунктирный круг</b>. Рисуй прямо на холсте. Тут же отмена, дублирование и очистка.', pos:'bottom'},
  {sel:'#newPresetBtn', title:'Своя фигура', body:'Не нашёл нужный значок? Нарисуй свой в мини-редакторе и сохрани в палитру — дальше ставь как обычный.', pos:'right'},
  {sel:'#inspector', title:'Свойства объекта', body:'Выдели объект — здесь меняешь цвет, толщину, размер (можно ввести в пикселях), поворот, пунктир. Тут же <b>закрепление</b> и копирование.', pos:'left'},
  {sel:'#btnLoad', title:'Загрузка и импорт', body:'Открыть проект, подложить картинку-схему для обводки или <b>импортировать чужую схему из SVG</b> (экспортируй её из Visio/LibreOffice).', pos:'top'},
  {sel:'#btnSave', title:'Сохранение и печать', body:'Сохрани в PNG, JPEG, PDF, SVG или проект .json. Можно сохранить/распечатать <b>только выбранную область</b> схемы.', pos:'top'},
  {sel:'#helpBtn', title:'Готово!', body:'Этот тур всегда можно открыть снова кнопкой «?». Удачных схем! 😊', pos:'top'}
];
let tourIdx=0, tourEls=null;
function startTour(){
  tourIdx=0;
  const ov=document.createElement('div');ov.id='tourOv';
  ov.innerHTML=`<div id="tourDim"></div><div id="tourHole"></div>
    <div id="tourCard">
      <div class="tc-step"></div><div class="tc-title"></div><div class="tc-body"></div>
      <div class="tc-foot">
        <div class="tc-dots">${TOUR.map(()=>'<span class="tc-dot"></span>').join('')}</div>
        <button class="tc-skip">Пропустить</button>
        <button class="tc-next">Далее</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  tourEls={ov,hole:ov.querySelector('#tourHole'),card:ov.querySelector('#tourCard'),
    step:ov.querySelector('.tc-step'),title:ov.querySelector('.tc-title'),body:ov.querySelector('.tc-body'),
    dots:[...ov.querySelectorAll('.tc-dot')],next:ov.querySelector('.tc-next'),skip:ov.querySelector('.tc-skip'),
    dim:ov.querySelector('#tourDim')};
  tourEls.next.onclick=()=>{tourIdx++;if(tourIdx>=TOUR.length)endTour();else showTourStep();};
  tourEls.skip.onclick=endTour;
  tourEls.dim.onclick=endTour;
  showTourStep();
  window.addEventListener('resize',showTourStep);
}
function endTour(){
  if(tourEls){window.removeEventListener('resize',showTourStep);tourEls.ov.remove();tourEls=null;}
  try{localStorage.setItem('tourDone','1');}catch(_){}
}
function showTourStep(){
  if(!tourEls)return;
  const s=TOUR[tourIdx];
  const el=document.querySelector(s.sel);
  tourEls.dots.forEach((d,i)=>d.classList.toggle('on',i===tourIdx));
  tourEls.step.textContent=`Шаг ${tourIdx+1} из ${TOUR.length}`;
  tourEls.title.textContent=s.title;
  tourEls.body.innerHTML=s.body;
  tourEls.next.textContent=(tourIdx===TOUR.length-1)?'Завершить':'Далее';
  if(!el){ // элемента нет — центрируем карточку
    tourEls.hole.style.opacity='0';
    tourEls.card.style.left='50%';tourEls.card.style.top='50%';tourEls.card.style.transform='translate(-50%,-50%)';
    return;
  }
  tourEls.hole.style.opacity='1';
  const r=el.getBoundingClientRect();const pad=6;
  tourEls.hole.style.left=(r.left-pad)+'px';tourEls.hole.style.top=(r.top-pad)+'px';
  tourEls.hole.style.width=(r.width+pad*2)+'px';tourEls.hole.style.height=(r.height+pad*2)+'px';
  // позиция карточки
  const cw=300, ch=tourEls.card.offsetHeight||190, gap=16;
  let x,y,tf='none';
  const pos=s.pos;
  if(pos==='right'){x=r.right+gap;y=r.top;}
  else if(pos==='left'){x=r.left-cw-gap;y=r.top;}
  else if(pos==='bottom'){x=r.left+r.width/2-cw/2;y=r.bottom+gap;}
  else {x=r.left+r.width/2-cw/2;y=r.top-ch-gap;} // top
  // удержать в экране
  x=Math.max(10,Math.min(x,innerWidth-cw-10));
  y=Math.max(10,Math.min(y,innerHeight-ch-10));
  tourEls.card.style.left=x+'px';tourEls.card.style.top=y+'px';tourEls.card.style.transform=tf;
}
document.getElementById('helpBtn').onclick=startTour;

// splash screen
(function(){
  const sp=document.getElementById('splash');const st=document.getElementById('spStatus');
  if(!sp)return;
  const steps=['Загрузка палитры…','Подготовка холста…','Готово'];let i=0;
  const iv=setInterval(()=>{if(st)st.textContent=steps[i]||'Готово';i++;if(i>=steps.length)clearInterval(iv);},420);
  setTimeout(()=>{sp.classList.add('hide');setTimeout(()=>sp.remove(),600);
    // первый запуск -> тур, иначе подсказка
    let done=false;try{done=localStorage.getItem('tourDone')==='1';}catch(_){}
    if(!done){setTimeout(startTour,400);}
    else{toast('Нужна помощь? Жми «?» справа внизу для быстрого тура',3600,'💡');}
  },1500);
})();


/* ===== всплывающие подсказки (tooltips) ===== */
(function(){
  const tip=document.createElement('div');tip.id='tooltip';document.body.appendChild(tip);
  let cur=null, showT=null;
  function findTip(el){
    while(el&&el!==document.body){
      if(el.dataset&&el.dataset.tip!==undefined)return el;
      if(el.getAttribute&&el.getAttribute('title')){
        el.dataset.tip=el.getAttribute('title');el.removeAttribute('title');return el;
      }
      el=el.parentElement;
    }
    return null;
  }
  function fmt(txt){
    // выделяем сочетания в скобках (...) как клавиши
    return txt.replace(/\(([^)]+)\)/g,(m,k)=>`<span class="tt-key">${k}</span>`);
  }
  function place(e){
    const pad=14;let x=e.clientX+pad, y=e.clientY+pad;
    const r=tip.getBoundingClientRect();
    if(x+r.width>innerWidth-8)x=e.clientX-r.width-pad;
    if(y+r.height>innerHeight-8)y=e.clientY-r.height-pad;
    tip.style.left=x+'px';tip.style.top=y+'px';
  }
  document.addEventListener('pointermove',e=>{
    const el=findTip(e.target);
    if(el&&el.dataset.tip){
      if(cur!==el){cur=el;tip.innerHTML=fmt(el.dataset.tip);clearTimeout(showT);
        showT=setTimeout(()=>{tip.classList.add('show');},220);}
      place(e);
    }else if(cur){cur=null;clearTimeout(showT);tip.classList.remove('show');}
  });
  document.addEventListener('pointerdown',()=>{cur=null;clearTimeout(showT);tip.classList.remove('show');});
})();

/* ===== тосты (всплывающие уведомления снизу) ===== */
let _toastEl=null,_toastT=null;
function toast(msg,ms=2600,ico='✓'){
  if(!_toastEl){_toastEl=document.createElement('div');_toastEl.id='toast';document.body.appendChild(_toastEl);}
  _toastEl.innerHTML=`<span class="toast-ico">${ico}</span><span>${msg}</span>`;
  _toastEl.classList.add('show');
  clearTimeout(_toastT);_toastT=setTimeout(()=>_toastEl.classList.remove('show'),ms);
}
